<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bismillah Cafe &amp; BBQ — POS &amp; Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#1B2430;--ink-soft:#4A5568;--line:#E2E5EA;--line-soft:#EEF0F3;--surface:#FFFFFF;--canvas:#F5F6F8;
  --primary:#0E5C4E;--primary-dark:#093F35;--primary-soft:#E4F0EC;--accent:#C7622B;--accent-soft:#FBE9DE;
  --gold:#B08A2E;--gold-soft:#F5EFDC;--danger:#B0362C;--danger-soft:#FBE7E4;--good:#1E7A4C;--good-soft:#E5F3EA;
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}

#app{display:none;flex-direction:column;min-height:100vh;}
#topnav{background:var(--primary-dark);color:#EAF3EF;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.25);}
#topnav .nav-row{display:flex;align-items:stretch;min-height:54px;}
#topnav .brand{display:flex;align-items:center;padding:0 20px 0 18px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0;}
#topnav .brand .mark{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;}
#topnav .brand .sub{font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;color:#8FB8AC;margin-top:2px;}
.nav-menus{display:flex;align-items:stretch;flex:1;min-width:0;}
.nav-menu-item{position:relative;}
.nav-menu-btn{display:flex;align-items:center;gap:5px;padding:0 14px;height:54px;font-size:12.5px;font-weight:600;color:#D6E8E1;white-space:nowrap;border:none;background:none;}
.nav-menu-btn:hover,.nav-menu-btn.open{background:rgba(255,255,255,.08);color:#fff;}
.nav-menu-btn.active-group{box-shadow:inset 0 -2px 0 var(--accent);color:#fff;}
.nav-dropdown{position:absolute;top:100%;left:0;background:var(--primary-dark);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--accent);border-radius:0 0 8px 8px;min-width:220px;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;z-index:300;}
.nav-dropdown.show{display:block;}
.nav-dd-item{display:block;padding:9px 18px;font-size:12.5px;color:#D0E5DC;cursor:pointer;white-space:nowrap;text-decoration:none;}
.nav-dd-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-dd-item.active{color:#F3A877;font-weight:600;}
.nav-right{display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid rgba(255,255,255,.1);margin-left:auto;flex-shrink:0;}
.nav-clock{font-size:11.5px;color:#8FB8AC;font-family:var(--mono);}
.nav-pill{font-size:10.5px;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,.15);color:#C8DDD7;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.2);cursor:pointer;}
.nav-pill.synced{background:rgba(30,122,76,.35);color:#7BE0A8;}
.nav-pill.syncing{background:rgba(176,138,46,.3);color:#F0D07A;}
.nav-pill.error{background:rgba(176,54,44,.35);color:#F7A09A;}
.nav-user{display:flex;align-items:center;gap:7px;font-size:12px;color:#EAF3EF;}
.nav-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
/* ---- home launcher ---- */
.nav-home{display:flex;align-items:center;gap:7px;padding:0 18px;height:54px;border:none;background:none;color:#D6E8E1;font-size:13px;font-weight:600;}
.nav-home:hover,.nav-home.active{background:rgba(255,255,255,.08);color:#fff;}
.nav-home.active{box-shadow:inset 0 -3px 0 var(--accent);}
.nav-crumb{display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12.5px;color:#8FB8AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-crumb b{color:#fff;font-weight:600;}
.nav-crumb .sep{opacity:.5;}
.back-home{background:none;border:none;color:var(--primary);font-weight:600;font-size:12.5px;padding:0;margin:0 0 10px;}
.back-home:hover{text-decoration:underline;}
.home-hero{margin-bottom:8px;}
.home-group{font-family:"Poppins",var(--sans);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--gc);margin:26px 0 14px;display:flex;align-items:center;gap:10px;}
.home-group::after{content:"";flex:1;height:1px;background:var(--line);}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.hcard{position:relative;background:#fff;border-radius:6px;box-shadow:0 2px 6px rgba(30,40,60,.06),0 8px 24px rgba(30,40,60,.06);cursor:pointer;overflow:hidden;transition:transform .18s,box-shadow .18s;outline:none;}
.hcard:hover,.hcard:focus-visible{transform:translateY(-3px);box-shadow:0 4px 10px rgba(30,40,60,.08),0 16px 36px rgba(30,40,60,.12);}
.hcard:focus-visible{box-shadow:0 0 0 3px var(--gl,#9FE0C0),0 16px 36px rgba(30,40,60,.12);}
.hcard-art{position:relative;height:230px;background:#fff;border-bottom:1px solid var(--line-soft);}
.hcard-art svg{width:100%;height:100%;display:block;}
.hcard-badge{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#fff;color:var(--ink-soft);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.hcard-badge.on{color:var(--good);}
.hcard-badge.warn{color:#8A5A00;background:#FFF3CD;}
.hcard-plus{position:absolute;right:28px;top:196px;width:70px;height:70px;border-radius:50%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(30,40,60,.15);transition:transform .15s,background .15s,color .15s;z-index:2;}
.hcard-plus:hover{background:var(--primary);color:#fff;transform:scale(1.06);}
.hcard-body{padding:22px 26px 26px;}
.hcard-tag{font-family:"Poppins",var(--sans);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:6px;}
.hcard-title{font-family:"Poppins",var(--sans);font-size:27px;font-weight:600;color:#2E3A4D;margin-top:6px;line-height:1.2;}
@media (max-width:700px){ .home-grid{grid-template-columns:1fr;} .hcard-art{height:190px;} .hcard-plus{top:158px;width:60px;height:60px;right:20px;} .hcard-title{font-size:23px;} }
#content{flex:1;padding:22px 26px 60px;max-width:1440px;width:100%;margin:0 auto;}

#loginOverlay{position:fixed;inset:0;background:var(--primary-dark);display:none;align-items:center;justify-content:center;z-index:999;}
#loginOverlay.show{display:flex;}
.login-box{background:var(--surface);border-radius:12px;padding:36px 40px;width:380px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-box .brand-lg{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;}
.login-box .brand-sub{color:var(--ink-soft);font-size:12px;margin-bottom:24px;}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

h1.page-title{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 3px;}
.page-desc{color:var(--ink-soft);font-size:13px;margin:0 0 18px;max-width:760px;}
h2.section-title{font-size:14px;font-weight:700;margin:24px 0 10px;color:var(--primary-dark);display:flex;align-items:center;gap:8px;}
h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
.kpi.accent::before{background:var(--accent);}.kpi.gold::before{background:var(--gold);}.kpi.danger::before{background:var(--danger);}
.kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600;}
.kpi .value{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:6px;}
.kpi .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;}
.chart-box h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);}
.chart-box .cwrap{position:relative;height:250px;}

.equation{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.eq-box{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;}
.eq-box .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:700;}
.eq-box .value{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:4px;}
.eq-box.net{background:var(--primary-soft);border-color:#BFDDD3;}
.eq-box.net .value{color:var(--primary-dark);}
.eq-box.disc .value{color:var(--danger);}
.eq-op{display:flex;align-items:center;font-size:22px;font-weight:700;color:var(--ink-soft);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{text-align:left;background:var(--primary-soft);color:var(--primary-dark);padding:9px 12px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
tbody td{padding:8px 12px;border-top:1px solid var(--line-soft);white-space:nowrap;}
tbody tr:hover{background:#FAFBF9;}
tr.total-row td{background:var(--good-soft);font-weight:700;border-top:2px solid #BFDDD3;}
td.num,th.num{text-align:right;font-family:var(--mono);}
td.mono{font-family:var(--mono);}
.pos-val{color:var(--good);font-weight:700;}.neg-val{color:var(--danger);font-weight:700;}
.tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--line-soft);color:var(--ink-soft);}
.tag.good{background:var(--good-soft);color:var(--good);}.tag.warn{background:var(--gold-soft);color:var(--gold);}
.tag.bad{background:var(--danger-soft);color:var(--danger);}.tag.info{background:var(--primary-soft);color:var(--primary-dark);}
.row-del{color:var(--danger);opacity:.6;font-size:15px;background:none;border:none;padding:0 4px;}
.row-del:hover{opacity:1;}
.empty-row td{color:var(--ink-soft);font-style:italic;text-align:center;padding:20px;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.form-grid .field{margin-bottom:0;}
.field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
.field input:disabled{background:var(--canvas);color:var(--ink-soft);}
.btn{padding:8px 16px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:12.5px;background:var(--primary);color:#fff;}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:#fff;color:var(--primary-dark);border-color:var(--line);}
.btn.secondary:hover{background:var(--primary-soft);}
.btn.accent{background:var(--accent);}.btn.accent:hover{background:#A34E20;}
.btn.danger{background:var(--danger);}.btn.danger:hover{background:#8E2A22;}
.btn.small{padding:5px 10px;font-size:11.5px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--primary-dark);border-color:var(--accent);}
.note{background:var(--gold-soft);border:1px solid #E8D9AE;border-radius:6px;padding:10px 14px;font-size:12px;color:#6B5518;margin-bottom:14px;}
.note.blue{background:var(--primary-soft);border-color:#BFDDD3;color:var(--primary-dark);}
.mode-bar{display:none;background:repeating-linear-gradient(45deg,#FFF3CD,#FFF3CD 14px,#FCEBB6 14px,#FCEBB6 28px);border-bottom:1px solid #E8D9AE;color:#6B5518;font-size:12.5px;padding:7px 16px;text-align:center;}
.mode-bar.show{display:block;}
.mode-bar a{color:#8A4B12;font-weight:700;cursor:pointer;text-decoration:underline;}
.nav-pill.test{background:#F0B429;color:#3D2A00;border-color:#F0B429;}
.nav-pill.live{background:rgba(30,122,76,.45);color:#B7F5D0;border-color:rgba(123,224,168,.5);}
.login-mode{display:none;margin:-14px 0 18px;}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.check-row .ic{width:22px;flex-shrink:0;text-align:center;font-weight:700;}
.check-row .ic.ok{color:var(--good);} .check-row .ic.warn{color:var(--gold);}
.check-row small{display:block;color:var(--ink-soft);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .25s;z-index:10001;pointer-events:none;max-width:420px;}
.toast.show{opacity:1;transform:translateY(0);}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
.muted{color:var(--ink-soft);}
.bold{font-weight:700;}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:900;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 10px;}
.modal-card{background:#fff;border-radius:12px;padding:24px 26px;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:100%;}
.modal-card h3{margin:0 0 6px;font-size:16px;color:var(--primary-dark);}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}

/* shift bar */
.shift-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--primary-soft);border:1px solid #BFDDD3;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--primary-dark);}
.shift-bar .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(30,122,76,.2);}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s,transform .05s;user-select:none;}
.menu-card:hover{border-color:var(--accent);}
.menu-card:active{transform:scale(.98);}
.menu-card .nm{font-weight:600;font-size:13px;}
.menu-card .cat{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.menu-card .pr{font-family:var(--mono);color:var(--primary-dark);font-weight:700;margin-top:8px;}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;position:sticky;top:70px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.cart-item .ci-name{flex:1;min-width:0;}
.cart-item .ci-name small{display:block;color:var(--ink-soft);font-family:var(--mono);}
.qtybox{display:flex;align-items:center;gap:5px;}
.qtybox button{width:22px;height:22px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:12px;line-height:1;}
.cart-total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;}
.cart-total-row.grand{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--primary-dark);}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{flex:1;border:none;background:#fff;padding:8px 6px;font-size:12px;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--primary);color:#fff;}

/* receipt */
#receiptModal{position:fixed;inset:0;background:rgba(20,25,22,.55);display:none;align-items:center;justify-content:center;z-index:950;}
#receiptModal.show{display:flex;}
.receipt-paper{width:300px;background:#fff;padding:18px 16px;font-family:var(--mono);font-size:11.5px;color:#111;max-height:78vh;overflow-y:auto;border-radius:4px;}
.receipt-paper h4{text-align:center;margin:0 0 2px;font-size:14px;}
.receipt-paper .c{text-align:center;}
.receipt-paper hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt-line{display:flex;justify-content:space-between;gap:8px;}

.z-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee;font-size:12px;}
.z-row.total{font-weight:700;border-top:2px solid #333;border-bottom:none;padding-top:6px;}
.z-sec{margin:14px 0 4px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#555;border-bottom:1px dashed #ccc;padding-bottom:4px;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D2D6DB;border-radius:6px;}

@media print{
  body *{visibility:hidden;}
  #receiptModal,#receiptModal *{visibility:visible;}
  #receiptModal{position:absolute;inset:auto;top:0;left:0;background:#fff;display:block;}
  #receiptModal .modal-actions{display:none !important;}
  .receipt-paper{max-height:none;overflow:visible;width:72mm;padding:0;}
  @page{margin:4mm;}
}
@media (max-width:1000px){
  #topnav .nav-row{flex-wrap:wrap;}
  .nav-menus{order:3;flex:0 0 100%;width:100%;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);}
  .nav-menu-btn{height:42px;}
  .nav-right{padding:6px 12px;flex-wrap:wrap;gap:6px;margin-left:0;border-left:none;flex:0 0 100%;width:100%;justify-content:flex-start;order:2;}
  .nav-clock,#navUserName{display:none;}
  #topnav .brand{padding:10px 14px;border-right:none;}
  .mode-bar{font-size:11.5px;}
  .pos-layout,.chart-row{grid-template-columns:1fr;}
  .cart{position:static;}
  #content{padding:16px 14px 50px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="brand-lg" id="loginBrand">Bismillah Cafe &amp; BBQ</div>
    <div class="brand-sub">POS &amp; Sales Management — please sign in</div>
    <div class="login-mode" id="loginMode"><span class="tag warn">🧪 TEST MODE — practice data</span></div>
    <div class="field"><label>Username</label><input id="loginUser" type="text" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn block" id="loginBtn" style="margin-top:10px">Sign In</button>
    <div class="login-err" id="loginErr">Invalid username or password.</div>
  </div>
</div>

<div id="app">
  <nav id="topnav">
    <div class="nav-row">

<script>
'use strict';
/* =====================================================================
   SECTION 1 — CONSTANTS, UTILITIES
   ===================================================================== */
const STORAGE_KEY = 'rms_pos_db_v1';
const SESSION_KEY = 'rms_pos_session_v1';
const FB_CFG_KEY  = 'rms_pos_fb_cfg_v1';
const ORDER_TYPES = ['Dine In','Take Away','Delivery'];
const PAY_METHODS = ['Cash','Card','Online/Wallet'];
const SHIFT_NAMES = ['Morning','Evening','Night','Full Day'];
const DENOMS = [5000,1000,500,100,50,20,10];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n,w){ return String(n).padStart(w||2,'0'); }
function localISO(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowTime(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return localISO(d); }
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p[2]+' '+MONTHS[+p[1]-1]+' '+p[0]; }
function monthLabel(ym){ const p=ym.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function fmtNum(n,dp){ dp=dp===undefined?2:dp; return (Number(n)||0).toLocaleString('en-PK',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtQty(n){ return (Number(n)||0).toLocaleString('en-PK',{maximumFractionDigits:2}); }
function cur(){ return (DB && DB.settings && DB.settings.currency) || 'Rs.'; }
function money(n){ n=Number(n)||0; return (n<0?'-':'')+cur()+' '+fmtNum(Math.abs(n),2); }
function byId(arr,key,val){ return (arr||[]).find(r=>r && r[key]===val); }
function labelOf(arr,key,val,nameKey){ const r=byId(arr,key,val); return r?r[nameKey]:(val||''); }
function maxNum(arr,prefix,key){
  let m=0; (arr||[]).forEach(r=>{ const v=String((r&&r[key])||''); if(v.startsWith(prefix)){ const rest=v.slice(prefix.length); if(/^\d+$/.test(rest)) m=Math.max(m,parseInt(rest,10)); } });
  return m;
}
function uid(prefix,arr,key,width){ return prefix+pad(maxNum(arr,prefix,key||'id')+1, width||3); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function toArr(x){ if(!x) return []; if(Array.isArray(x)) return x.filter(Boolean); if(typeof x==='object') return Object.values(x).filter(Boolean); return []; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }

function openModal(html,width){
  closeModal();
  const back=document.createElement('div');
  back.className='modal-back'; back.id='_modal';
  back.innerHTML=`<div class="modal-card" style="width:${width||480}px">${html}</div>`;
  document.getElementById('modalRoot').appendChild(back);
  back.addEventListener('mousedown',e=>{ if(e.target===back) closeModal(); });
  return back;
}
function closeModal(){ const m=document.getElementById('_modal'); if(m) m.remove(); }
function modalOpen(){ return !!document.getElementById('_modal'); }

/* =====================================================================
   SECTION 2 — DATA MODEL & SEED
   ===================================================================== */
const PERM = (v,a,e,d)=>({view:!!v,add:!!a,edit:!!e,del:!!d});
function seedData(){
  return {
    settings:{name:'Bismillah Cafe & BBQ',address:'',phone:'',footer:'Thank you for dining with us!',currency:'Rs.',mode:'test',liveSince:''},
    users:[
      {id:'USR001',name:'Administrator',username:'admin',password:'admin123',role:'Admin',active:'Y'},
      {id:'USR002',name:'Manager',username:'manager',password:'mgr123',role:'Manager',active:'Y'},
      {id:'USR003',name:'Cashier 1',username:'cashier1',password:'cash123',role:'Cashier',active:'Y'},
    ],
    roles:[
      {id:'ROL001',name:'Manager',permissions:{
        dashboard:PERM(1),pos:PERM(1,1,1,1),shifts:PERM(1,1,1),shiftSummary:PERM(1),salesReports:PERM(1),refunds:PERM(1,1,0,1),
        menuTypes:PERM(1,1,1),menuCategories:PERM(1,1,1),menuItems:PERM(1,1,1),discounts:PERM(1,1,1),
        roles:PERM(),users:PERM(),settings:PERM(1)}},
      {id:'ROL002',name:'Cashier',permissions:{
        dashboard:PERM(1),pos:PERM(1,1),shifts:PERM(1,1),shiftSummary:PERM(),salesReports:PERM()}},
      {id:'ROL003',name:'Viewer',permissions:{
        dashboard:PERM(1),shiftSummary:PERM(1),salesReports:PERM(1),menuTypes:PERM(1),menuCategories:PERM(1),menuItems:PERM(1),discounts:PERM(1)}},
    ],
    menus:[
      {id:'MN001',name:'Normal Menu',active:'Y'},
      {id:'MN002',name:'Staff Menu',active:'Y'},
      {id:'MN003',name:'Corporate Menu',active:'Y'},
    ],
    menuCategories:[
      {id:'MC01',name:'Starters',active:'Y'},{id:'MC02',name:'Main Course',active:'Y'},
      {id:'MC03',name:'Rice & Bread',active:'Y'},{id:'MC04',name:'Beverages',active:'Y'},
      {id:'MC05',name:'Desserts',active:'Y'},
    ],
    menuItems:[
      {id:'MI001',name:'Chicken Tikka',catId:'MC01',menuId:'MN001',price:950,active:'Y'},
      {id:'MI002',name:'Butter Chicken',catId:'MC02',menuId:'MN001',price:1250,active:'Y'},
      {id:'MI003',name:'Chicken Karahi (Half)',catId:'MC02',menuId:'MN001',price:1100,active:'Y'},
      {id:'MI004',name:'Steam Rice',catId:'MC03',menuId:'MN001',price:250,active:'Y'},
      {id:'MI005',name:'Butter Naan',catId:'MC03',menuId:'MN001',price:90,active:'Y'},
      {id:'MI006',name:'Soft Drink',catId:'MC04',menuId:'MN001',price:150,active:'Y'},
      {id:'MI007',name:'Kheer',catId:'MC05',menuId:'MN001',price:300,active:'Y'},
      {id:'MI008',name:'Staff Meal',catId:'MC02',menuId:'MN002',price:400,active:'Y'},
      {id:'MI009',name:'Corporate Platter',catId:'MC02',menuId:'MN003',price:3500,active:'Y'},
    ],
    discounts:[
      {id:'DC00',name:'No Discount',type:'Amount',value:0,active:'Y'},
      {id:'DC01',name:'Staff Discount 10%',type:'Percent',value:10,active:'Y'},
      {id:'DC02',name:'Manager Discount 15%',type:'Percent',value:15,active:'Y'},
      {id:'DC03',name:'Promo Flat 200',type:'Amount',value:200,active:'Y'},
    ],
    shiftSessions:[],
    orders:[],
    refunds:[],
  };
}
const MASTER_TABLES = ['users','roles','menus','menuCategories','menuItems','discounts'];

function normalize(db){
  const seed=seedData();
  db = (db && typeof db==='object') ? db : {};
  db.settings = Object.assign({}, seed.settings, (db.settings && typeof db.settings==='object') ? db.settings : {});
  if(!db.settings.name || db.settings.name==='New Restaurant') db.settings.name = seed.settings.name;
  if(db.settings.mode!=='live') db.settings.mode='test';
  MASTER_TABLES.forEach(t=>{ db[t] = (db[t]===undefined) ? clone(seed[t]) : toArr(db[t]); });
  db.orders = toArr(db.orders);
  db.shiftSessions = toArr(db.shiftSessions);
  db.refunds = toArr(db.refunds);
  db.refunds.forEach(r=>{ r.items = toArr(r.items); });
  db.roles.forEach(r=>{ if(r.permissions && typeof r.permissions==='object' && !r.permissions.refunds)
    r.permissions.refunds = r.name==='Manager' ? PERM(1,1) : (r.name==='Viewer' ? PERM(1) : PERM()); });
  db.orders.forEach(o=>{ o.items = toArr(o.items); });
  db.roles.forEach(r=>{ if(!r.permissions || typeof r.permissions!=='object') r.permissions={}; });
  if(!db.users.some(u=>u.role==='Admin')) db.users.unshift(clone(seed.users[0])); // never lock out
  return db;
}
let DB = null;

/* =====================================================================
   SECTION 3 — PERSISTENCE (localStorage cache + Firebase record-level sync)
   Firebase layout under <path>:
     master/   -> settings + setup tables (whole object)
     orders/<orderId>   -> one record per order (items embedded)
     shifts/<shiftId>   -> one record per cashier shift
     counters/order|shift -> running numbers (transaction-safe across devices)
   Writing one record at a time means two tills can sell at the same
   moment without overwriting each other.
   ===================================================================== */
let _fbApp=null,_fbDb=null,_fbRoot=null,_fbConnected=false,_fbListening=false;

function saveLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){} }
function loadLocal(){ try{ const raw=localStorage.getItem(STORAGE_KEY); return raw? normalize(JSON.parse(raw)) : null; }catch(e){ return null; } }
function masterOf(db){ const m={settings:db.settings}; MASTER_TABLES.forEach(t=>m[t]=db[t]); return clone(m); }
function mapOf(arr){ const o={}; arr.forEach(r=>{ const c=clone(r); delete c._unsynced; o[r.id]=c; }); return o; }
function toRemote(db){ return {master:masterOf(db), orders:mapOf(db.orders), shifts:mapOf(db.shiftSessions), refunds:mapOf(db.refunds)}; }
function fromRemote(v){
  const m=(v&&v.master)||{};
  const db={settings:m.settings}; MASTER_TABLES.forEach(t=>db[t]=m[t]===undefined?[]:m[t]);
  db.orders=v&&v.orders; db.shiftSessions=v&&v.shifts; db.refunds=v&&v.refunds;
  return normalize(db);
}

function setSync(state,label){
  const el=document.getElementById('syncPill'); if(!el) return;
  el.className='nav-pill'+(state?' '+state:''); el.textContent=label;
}
function fbWrite(path,val){
  if(!_fbRoot) return Promise.resolve(false);
  setSync('syncing','⟳ Saving…');
  return _fbRoot.child(path).set(val===null?null:clone(val))
    .then(()=>{ setSync('synced','✓ Synced'); return true; })
    .catch(e=>{ setSync('error','✕ Sync error'); console.error(e); return false; });
}
function saveMaster(){ saveLocal(); return fbWrite('master', masterOf(DB)); }
function saveOrder(o){
  if(!DB.orders.includes(o)) DB.orders.push(o);
  if(_fbRoot) o._unsynced=true;
  saveLocal();
  const copy=clone(o); delete copy._unsynced;
  return fbWrite('orders/'+o.id, copy).then(ok=>{ if(ok){ delete o._unsynced; saveLocal(); } return ok; });
}
function removeOrder(id){ DB.orders=DB.orders.filter(o=>o.id!==id); saveLocal(); return fbWrite('orders/'+id,null); }
function saveRefund(r){
  if(!DB.refunds.includes(r)) DB.refunds.push(r);
  if(_fbRoot) r._unsynced=true;
  saveLocal();
  const copy=clone(r); delete copy._unsynced;
  return fbWrite('refunds/'+r.id, copy).then(ok=>{ if(ok){ delete r._unsynced; saveLocal(); } return ok; });
}
function removeRefund(id){ DB.refunds=DB.refunds.filter(r=>r.id!==id); saveLocal(); return fbWrite('refunds/'+id,null); }
function saveShift(s){
  if(!DB.shiftSessions.includes(s)) DB.shiftSessions.push(s);
  if(_fbRoot) s._unsynced=true;
  saveLocal();
  const copy=clone(s); delete copy._unsynced;
  return fbWrite('shifts/'+s.id, copy).then(ok=>{ if(ok){ delete s._unsynced; saveLocal(); } return ok; });
}

/* Next running number: uses a Firebase transaction when online so two tills never get the same number */
async function nextId(counter,prefix,arr,width){
  const localNext = maxNum(arr,prefix,'id')+1;
  if(_fbRoot && _fbConnected){
    try{
      const res = await withTimeout(_fbRoot.child('counters/'+counter).transaction(n=>Math.max(Number(n)||0, localNext-1)+1), 5000);
      if(res && res.committed) return prefix+pad(res.snapshot.val(),width);
    }catch(e){ /* fall through */ }
  }
  if(_fbRoot){ // offline with cloud configured: add a suffix so it can't clash with another till
    return prefix+pad(localNext,width)+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
  }
  return prefix+pad(localNext,width);
}

function getFbCfg(){ try{ return JSON.parse(localStorage.getItem(FB_CFG_KEY)||'{}'); }catch(e){ return {}; } }
function initFirebase(cfg){
  if(typeof firebase==='undefined') return false;
  try{
    stopFirebase();
    _fbApp = firebase.initializeApp({apiKey:cfg.apiKey, databaseURL:cfg.dbUrl, projectId:cfg.projectId}, 'rms-'+Date.now());
    _fbDb = firebase.database(_fbApp);
    _fbRoot = _fbDb.ref((cfg.path||'restaurant2').replace(/[.#$\[\]]/g,'_'));
    return true;
  }catch(e){ console.error(e); _fbApp=null;_fbDb=null;_fbRoot=null; return false; }
}
function stopFirebase(){
  if(_fbRoot){ try{ _fbRoot.off(); }catch(e){} }
  if(_fbDb){ try{ _fbDb.ref('.info/connected').off(); }catch(e){} }
  if(_fbApp){ try{ _fbApp.delete(); }catch(e){} }
  _fbApp=null;_fbDb=null;_fbRoot=null;_fbConnected=false;_fbListening=false;
}
let _rerenderT=null;
function startListener(){
  if(!_fbRoot || _fbListening) return;
  _fbListening=true;
  _fbDb.ref('.info/connected').on('value', s=>{
    _fbConnected=!!s.val();
    if(_fbConnected){ setSync('synced','✓ Synced'); pushUnsynced(); } else setSync('error','✕ Offline');
  });
  _fbRoot.on('value', snap=>{
    const v=snap.val();
    if(!v || !v.master) return;
    // keep any local records that have not reached the server yet
    const pendingOrders = DB ? DB.orders.filter(o=>o._unsynced) : [];
    const pendingShifts = DB ? DB.shiftSessions.filter(s=>s._unsynced) : [];
    const pendingRefunds = DB ? DB.refunds.filter(s=>s._unsynced) : [];
    DB = fromRemote(v);
    const live=DB.settings.mode==='live';
    pendingOrders.filter(p=>!(live&&p.test)).forEach(p=>{ const i=DB.orders.findIndex(o=>o.id===p.id); if(i>=0) DB.orders[i]=p; else DB.orders.push(p); });
    pendingShifts.filter(p=>!(live&&p.test)).forEach(p=>{ const i=DB.shiftSessions.findIndex(o=>o.id===p.id); if(i>=0) DB.shiftSessions[i]=p; else DB.shiftSessions.push(p); });
    pendingRefunds.filter(p=>!(live&&p.test)).forEach(p=>{ const i=DB.refunds.findIndex(o=>o.id===p.id); if(i>=0) DB.refunds[i]=p; else DB.refunds.push(p); });
    saveLocal();
    refreshCurrentUser();
    applyBranding();
    clearTimeout(_rerenderT);
    _rerenderT=setTimeout(liveRerender,250);
  }, err=>{ setSync('error','✕ '+(err.code||'Error')); });
}
function pushUnsynced(){
  if(!DB) return;
  DB.orders.filter(o=>o._unsynced).forEach(o=>saveOrder(o));
  DB.shiftSessions.filter(s=>s._unsynced).forEach(s=>saveShift(s));
  DB.refunds.filter(r=>r._unsynced).forEach(r=>saveRefund(r));
}
/* Only refresh pages where it is safe (no half-typed forms get wiped) */
function liveRerender(){
  if(!currentUser || !currentPage) return;
  const pg=PAGES.find(p=>p.key===currentPage);
  if(!pg) return;
  if(currentPage==='pos'){ if(window._posRefresh) window._posRefresh(); return; }
  if(pg.live && !modalOpen()) pg.render(document.getElementById('content'));
}

function openFirebaseCfg(){
  const cfg=getFbCfg();
  const m=openModal(`
    <h3>☁ Cloud Sync (Firebase)</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 14px">Connect to a Firebase Realtime Database so every till, manager PC and phone sees the same data live.</p>
    <div class="note blue" style="line-height:1.6">
      1. Open <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> → create a project → add a Web app<br>
      2. Build → Realtime Database → Create database<br>
      3. Copy the Database URL, API key and Project ID below<br>
      <b>Tip:</b> you can reuse the first restaurant's Firebase project — just give this restaurant a different <b>Data Path</b>.
    </div>
    <div class="field"><label>Database URL</label><input id="fbDbUrl" value="${esc(cfg.dbUrl||'')}" placeholder="https://your-project-default-rtdb.firebaseio.com"></div>
    <div class="field"><label>API Key</label><input id="fbApiKey" value="${esc(cfg.apiKey||'')}" placeholder="AIzaSy..."></div>
    <div class="field"><label>Project ID</label><input id="fbProjectId" value="${esc(cfg.projectId||'')}" placeholder="your-project-id"></div>
    <div class="field"><label>Data Path (unique per restaurant)</label><input id="fbPath" value="${esc(cfg.path||'restaurant2')}"></div>
    <div id="fbErr" style="display:none;color:var(--danger);font-size:12px;margin-top:6px"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="fbCancel">Cancel</button>
      ${cfg.dbUrl?'<button class="btn danger" id="fbDisconnect">Disconnect</button>':''}
      <button class="btn" id="fbConnect">Connect &amp; Sync</button>
    </div>`, 500);
  m.querySelector('#fbCancel').onclick=closeModal;
  const dis=m.querySelector('#fbDisconnect');
  if(dis) dis.onclick=()=>{ stopFirebase(); localStorage.removeItem(FB_CFG_KEY); setSync('','☁ Local'); closeModal(); toast('Disconnected — working locally on this device'); };
  m.querySelector('#fbConnect').onclick=async ()=>{
    const c={dbUrl:m.querySelector('#fbDbUrl').value.trim(), apiKey:m.querySelector('#fbApiKey').value.trim(),
             projectId:m.querySelector('#fbProjectId').value.trim(), path:(m.querySelector('#fbPath').value.trim()||'restaurant2')};
    const err=m.querySelector('#fbErr');
    if(!c.dbUrl||!c.apiKey||!c.projectId){ err.textContent='Please fill in all fields.'; err.style.display='block'; return; }
    setSync('syncing','⟳ Connecting…');
    if(!initFirebase(c)){ err.textContent='Could not initialise Firebase — check the values.'; err.style.display='block'; setSync('error','✕ Error'); return; }
    try{
      const snap=await withTimeout(_fbRoot.once('value'),10000);
      const v=snap.val();
      if(v && v.master){ DB=fromRemote(v); saveLocal(); toast('Connected — loaded data from the cloud'); }
      else { await _fbRoot.set(toRemote(DB)); toast('Connected — this device\'s data uploaded to the cloud'); }
      localStorage.setItem(FB_CFG_KEY, JSON.stringify(c));
      closeModal(); setSync('synced','✓ Synced'); startListener();
      refreshCurrentUser(); applyBranding(); buildNav(); navigateTo(currentPage||'dashboard');
    }catch(e){
      err.textContent='Connection failed: '+(e.message||e); err.style.display='block'; setSync('error','✕ Error'); stopFirebase();
    }
  };
}

/* ---------- Backup & Restore ---------- */
function openBackupModal(){
  const m=openModal(`
    <h3>💾 Backup &amp; Restore</h3>
    <div class="panel" style="background:var(--primary-soft);border-color:#BFDDD3;margin-top:12px">
      <b style="font-size:12px">EXPORT BACKUP</b>
      <p class="muted" style="font-size:12px;margin:6px 0 10px">Downloads all setup and sales data as a JSON file.</p>
      <button class="btn small" id="bkDownload">⬇ Download Backup</button>
    </div>
    ${currentUser.role==='Admin'?`
    <div class="panel" style="background:var(--accent-soft);border-color:#F2C9AE">
      <b style="font-size:12px">RESTORE FROM BACKUP</b>
      <p class="muted" style="font-size:12px;margin:6px 0 10px"><b>Replaces all current data</b> on this device and in the cloud.</p>
      <input type="file" id="bkFile" accept=".json" style="font-size:12px;width:100%;margin-bottom:8px">
      <button class="btn small danger" id="bkRestore">🔄 Restore Now</button>
      <div id="bkStatus" style="margin-top:8px;font-size:12px"></div>
    </div>`:''}
    <div class="modal-actions"><button class="btn secondary" id="bkClose">Close</button></div>`, 460);
  m.querySelector('#bkClose').onclick=closeModal;
  m.querySelector('#bkDownload').onclick=()=>{
    const data=clone(DB); data.orders.forEach(o=>delete o._unsynced); data.shiftSessions.forEach(s=>delete s._unsynced);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(DB.settings.name||'restaurant').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-backup-'+localISO()+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Backup downloaded');
  };
  const rb=m.querySelector('#bkRestore');
  if(rb) rb.onclick=()=>{
    const f=m.querySelector('#bkFile').files[0]; const st=m.querySelector('#bkStatus');
    if(!f){ st.style.color='var(--danger)'; st.textContent='Select a backup file first.'; return; }
    if(!confirm('Replace ALL current data with this backup?')) return;
    const rd=new FileReader();
    rd.onload=async e=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(!parsed || typeof parsed!=='object' || Array.isArray(parsed) || !parsed.menuItems) throw new Error('Not a valid backup file');
        DB=normalize(parsed); saveLocal();
        st.style.color='var(--primary)'; st.textContent='Restored locally…';
        if(_fbRoot){ await _fbRoot.set(toRemote(DB)); }
        st.textContent='✓ Restored. Reloading…'; setTimeout(()=>location.reload(),1200);
      }catch(err){ st.style.color='var(--danger)'; st.textContent='Error: '+err.message; }
    };
    rd.readAsText(f);
  };
}

/* =====================================================================
   SECTION 4 — AUTH & PERMISSIONS
   ===================================================================== */
let currentUser=null;
let currentPage=null;
function getPerm(key){
  if(!currentUser) return PERM();
  if(currentUser.role==='Admin') return PERM(1,1,1,1);
  const role=(DB.roles||[]).find(r=>r.name===currentUser.role);
  return (role && role.permissions && role.permissions[key]) || PERM();
}
function adminOnlyPage(k){ return typeof PAGES!=='undefined' && PAGES.some(p=>p.key===k && p.adminOnly); }

/* =====================================================================
   SECTION 5 — SALES COMPUTATION
   ===================================================================== */
function itemOf(id){ return byId(DB.menuItems,'id',id); }
function catIdOf(l){ const mi=itemOf(l.itemId); return mi?mi.catId:l.catId; }
function menuIdOf(l){ const mi=itemOf(l.itemId); return mi?mi.menuId:l.menuId; }
function catName(id){ return labelOf(DB.menuCategories,'id',id,'name')||'(Uncategorised)'; }
function menuName(id){ return labelOf(DB.menus,'id',id,'name')||'(No menu type)'; }
function calcDiscount(gross,disc){
  if(!disc) return 0;
  const v=Number(disc.value)||0;
  const amt = disc.type==='Percent' ? gross*v/100 : v;
  return Math.max(0, Math.min(round2(amt), gross));
}
function linesGross(items){ return round2(items.reduce((s,l)=>s+(Number(l.price)||0)*(Number(l.qty)||0),0)); }
function validOrders(){ return DB.orders.filter(o=>o.status!=='Void'); }

/* Report dimensions. Discount is order-level, so for item/category/menu-type
   views it is spread across the order's lines in proportion to line value. */
const DIMS = {
  menuType:{label:'Menu Type', key:(o,l)=>menuIdOf(l)||'', name:k=>menuName(k), sort:'net'},
  category:{label:'Category', key:(o,l)=>catIdOf(l)||'', name:k=>catName(k), sort:'net'},
  item:{label:'Menu Item', key:(o,l)=>l.itemId, name:(k,l)=>{ const mi=itemOf(k); return mi?mi.name:(l.name||k); }, sort:'net', extra:true},
  date:{label:'Date', key:o=>o.date, name:k=>fmtDate(k), sort:'key'},
  month:{label:'Month', key:o=>(o.date||'').slice(0,7), name:k=>monthLabel(k), sort:'key'},
  orderType:{label:'Order Type', key:o=>o.orderType||'Dine In', name:k=>k, sort:'net'},
  time:{label:'Time (Hour)', key:o=>(o.time||'00:00').slice(0,2), name:k=>{ const h=+k; const f=x=>((x%12)||12)+(x<12?' AM':' PM'); return f(h)+' – '+f((h+1)%24); }, sort:'key'},
  payment:{label:'Payment Method', key:o=>o.payMethod||'Cash', name:k=>k, sort:'net'},
  shift:{label:'Shift', key:o=>o.shiftName||'—', name:k=>k, sort:'net'},
};
function filterOrders(f){
  return validOrders().filter(o=>{
    if(f.from && o.date<f.from) return false;
    if(f.to && o.date>f.to) return false;
    if(f.orderType && o.orderType!==f.orderType) return false;
    if(f.payMethod && o.payMethod!==f.payMethod) return false;
    if(f.shiftName && o.shiftName!==f.shiftName) return false;
    if(f.cashierId && o.cashierId!==f.cashierId) return false;
    return true;
  });
}
/* Refunds are reported on the day/shift/payment method they were PAID OUT
   (that is when the money leaves the till), against the items refunded. */
function filterRefunds(f){
  return DB.refunds.filter(r=>{
    if(f.from && r.date<f.from) return false;
    if(f.to && r.date>f.to) return false;
    if(f.orderType && r.orderType!==f.orderType) return false;
    if(f.payMethod && r.payMethod!==f.payMethod) return false;
    if(f.shiftName && r.shiftName!==f.shiftName) return false;
    if(f.cashierId && r.cashierId!==f.cashierId) return false;
    return true;
  });
}
function salesAgg(f,dimKey){ return aggregate(filterOrders(f),dimKey,f,filterRefunds(f)); }
function aggregate(orders,dimKey,f,refunds){
  f=f||{}; refunds=refunds||[];
  const dim=DIMS[dimKey];
  const map=new Map();
  const tot={orders:new Set(),qty:0,gross:0,discount:0,refund:0,rqty:0,rcount:new Set()};
  const row=(k,l)=>{ let r=map.get(k); if(!r){ r={key:k,name:dim.name(k,l),cat:dim.extra?catName(catIdOf(l)):'',orders:new Set(),qty:0,gross:0,discount:0,refund:0,rqty:0}; map.set(k,r); } return r; };
  orders.forEach(o=>{
    const og=linesGross(o.items); const od=Number(o.discount)||0;
    o.items.forEach(l=>{
      if(f.menuId && menuIdOf(l)!==f.menuId) return;
      if(f.catId && catIdOf(l)!==f.catId) return;
      const g=(Number(l.price)||0)*(Number(l.qty)||0);
      const d= og ? od*g/og : 0;
      const r=row(dim.key(o,l),l);
      r.orders.add(o.id); r.qty+=Number(l.qty)||0; r.gross+=g; r.discount+=d;
      tot.orders.add(o.id); tot.qty+=Number(l.qty)||0; tot.gross+=g; tot.discount+=d;
    });
  });
  refunds.forEach(rf=>{
    const rg=linesGross(rf.items); const rn=Number(rf.net)||0;
    rf.items.forEach(l=>{
      if(f.menuId && menuIdOf(l)!==f.menuId) return;
      if(f.catId && catIdOf(l)!==f.catId) return;
      const g=(Number(l.price)||0)*(Number(l.qty)||0);
      const amt= rg ? rn*g/rg : 0;
      const r=row(dim.key(rf,l),l);
      r.refund+=amt; r.rqty+=Number(l.qty)||0;
      tot.refund+=amt; tot.rqty+=Number(l.qty)||0; tot.rcount.add(rf.id);
    });
  });
  const totNet=tot.gross-tot.discount-tot.refund;
  const rows=[...map.values()].map(r=>{ const net=r.gross-r.discount-r.refund; return {key:r.key,name:r.name,cat:r.cat,orders:r.orders.size,qty:r.qty,rqty:r.rqty,
    gross:round2(r.gross),discount:round2(r.discount),refund:round2(r.refund),net:round2(net),
    avg: r.orders.size? net/r.orders.size : 0, share: totNet? net/totNet*100 : 0}; });
  if(dim.sort==='key') rows.sort((a,b)=>String(a.key).localeCompare(String(b.key)));
  else rows.sort((a,b)=>b.net-a.net);
  const total={name:'TOTAL',cat:'',orders:tot.orders.size,qty:tot.qty,rqty:tot.rqty,refunds:tot.rcount.size,gross:round2(tot.gross),discount:round2(tot.discount),
    refund:round2(tot.refund),net:round2(totNet),avg:tot.orders.size?totNet/tot.orders.size:0,share:totNet?100:0};
  return {rows,total};
}

/* ---------- Refund helpers ---------- */
function refundsOfOrder(orderId){ return DB.refunds.filter(r=>r.orderId===orderId); }
function refundedQty(orderId,itemId,price){
  return refundsOfOrder(orderId).reduce((s,r)=>s+r.items.filter(l=>l.itemId===itemId && Number(l.price)===Number(price)).reduce((a,l)=>a+(Number(l.qty)||0),0),0);
}
function refundStatus(o){
  const rs=refundsOfOrder(o.id); if(!rs.length) return '';
  const sold=o.items.reduce((a,l)=>a+(Number(l.qty)||0),0), back=rs.reduce((a,r)=>a+r.items.reduce((b,l)=>b+(Number(l.qty)||0),0),0);
  return back>=sold?'Refunded':'Part refunded';
}
function refundTag(o){ const st=refundStatus(o); return st?` <span class="tag ${st==='Refunded'?'bad':'warn'}">${st}</span>`:''; }

/* ---------- Shift stats ---------- */
function shiftOrders(ssId){ return validOrders().filter(o=>o.shiftSessionId===ssId); }
function shiftRefunds(ssId){ return DB.refunds.filter(r=>r.shiftSessionId===ssId); }
function shiftStats(ss){
  const os=shiftOrders(ss.id), rs=shiftRefunds(ss.id);
  const st={orders:os.length,qty:0,gross:0,discount:0,refund:0,refunds:rs.length,net:0,cash:0,card:0,online:0,cashRefund:0};
  const addPay=(m,v)=>{ if(m==='Cash') st.cash+=v; else if(m==='Card') st.card+=v; else st.online+=v; };
  os.forEach(o=>{
    st.gross+=Number(o.gross)||0; st.discount+=Number(o.discount)||0;
    o.items.forEach(l=>st.qty+=Number(l.qty)||0);
    addPay(o.payMethod, Number(o.net)||0);
  });
  rs.forEach(r=>{ const v=Number(r.net)||0; st.refund+=v; addPay(r.payMethod,-v); if(r.payMethod==='Cash') st.cashRefund+=v; });
  st.net=st.gross-st.discount-st.refund;
  st.cashSales=st.cash+st.cashRefund;
  st.opening=Number(ss.openingCash)||0;
  st.expected=st.opening+st.cash;
  st.counted= ss.status==='Closed' ? (Number(ss.countedCash)||0) : null;
  st.diff= st.counted===null ? null : st.counted-st.expected;
  ['gross','discount','refund','net','cash','card','online','cashRefund','cashSales','expected'].forEach(k=>st[k]=round2(st[k]));
  if(st.diff!==null) st.diff=round2(st.diff);
  return st;
}
function myOpenShift(){ return currentUser ? DB.shiftSessions.find(s=>s.status==='Open' && s.cashierId===currentUser.id) : null; }

/* =====================================================================
   SECTION 6 — TABLE DEFINITIONS + PDF / EXCEL EXPORT
   def = {title, cols:[{label,key,type}], rows:[...], total:{...}|null}
   type: text | int | qty | money | pct | diff
   ===================================================================== */
const NUM_TYPES=['int','qty','money','pct','diff'];
function isNumCol(c){ return NUM_TYPES.includes(c.type); }
function fmtCell(c,v,forPdf){
  if(c.type==='text' || !c.type) return forPdf? String(v===undefined||v===null?'':v) : esc(v===undefined||v===null?'':v);
  if(v===null||v===undefined||v==='') return forPdf?'—':'—';
  if(c.type==='int') return fmtNum(v,0);
  if(c.type==='qty') return fmtQty(v);
  if(c.type==='pct') return (Number(v)||0).toFixed(1)+'%';
  if(c.type==='money') return forPdf? fmtNum(v,2) : money(v);
  if(c.type==='diff'){ const n=Number(v)||0; const s=(n>0?'+':'')+fmtNum(n,2); return forPdf? s : `<span class="${n<0?'neg-val':(n>0?'pos-val':'')}">${esc(s)}</span>`; }
  return esc(v);
}
function tableHTML(def){
  let h=`<div class="table-wrap"><table><thead><tr>${def.cols.map(c=>`<th class="${isNumCol(c)?'num':''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
  if(!def.rows.length) h+=`<tr class="empty-row"><td colspan="${def.cols.length}">${esc(def.empty||'No sales found for the selected filters.')}</td></tr>`;
  else{
    h+=def.rows.map(r=>`<tr>${def.cols.map(c=>`<td class="${isNumCol(c)?'num':''}">${fmtCell(c,r[c.key])}</td>`).join('')}</tr>`).join('');
    if(def.total) h+=`<tr class="total-row">${def.cols.map((c,i)=>`<td class="${isNumCol(c)?'num':''}">${i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':fmtCell(c,def.total[c.key]))}</td>`).join('')}</tr>`;
  }
  return h+`</tbody></table></div>`;
}
function reportMeta(lines){ return [...(isTestMode()?['*** TEST MODE — practice data, not real sales ***']:[]), ...lines, 'Generated: '+fmtDate(localISO())+' '+nowTime()+' by '+(currentUser?currentUser.name:'')]; }
function safeName(s){ return String(s).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase(); }

function exportPDF(title, defs, meta, fileName){
  const J=window.jspdf && window.jspdf.jsPDF;
  if(!J){ toast('PDF library could not load (check internet). Opening print view instead.'); return printTables(title,defs,meta); }
  const maxCols=Math.max(...defs.map(d=>d.cols.length));
  const doc=new J({orientation:maxCols>7?'landscape':'portrait',unit:'pt',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('PDF table plugin missing — opening print view instead.'); return printTables(title,defs,meta); }
  const W=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(DB.settings.name||'Bismillah Cafe & BBQ',40,40);
  doc.setFontSize(12); doc.text(title,40,58);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90);
  let y=74; meta.forEach(m=>{ doc.text(m,40,y); y+=11; });
  doc.setTextColor(0);
  doc.text('Amounts in '+cur(), W-40, 40, {align:'right'});
  y+=4;
  defs.forEach((def,di)=>{
    if(def.title && defs.length>1){ doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(def.title,40,y+10); y+=16; doc.setFont('helvetica','normal'); }
    const colStyles={}; def.cols.forEach((c,i)=>{ if(isNumCol(c)) colStyles[i]={halign:'right'}; });
    const body=def.rows.map(r=>def.cols.map(c=>fmtCell(c,r[c.key],true)));
    const foot=(def.total && def.rows.length)? [def.cols.map((c,i)=>i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':fmtCell(c,def.total[c.key],true)))] : undefined;
    doc.autoTable({
      head:[def.cols.map(c=>c.label)], body: body.length?body:[[{content:'No data',colSpan:def.cols.length,styles:{halign:'center',fontStyle:'italic'}}]],
      foot, startY:y, margin:{left:40,right:40}, theme:'grid',
      styles:{fontSize:8,cellPadding:4,overflow:'linebreak'},
      headStyles:{fillColor:[14,92,78],textColor:255,fontStyle:'bold'},
      footStyles:{fillColor:[228,240,236],textColor:20,fontStyle:'bold'},
      columnStyles:colStyles, showFoot:'lastPage',
      didParseCell:d=>{ if((d.section==='head'||d.section==='foot') && isNumCol(def.cols[d.column.index]||{})) d.cell.styles.halign='right'; },
    });
    y=doc.lastAutoTable.finalY+20;
  });
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Page '+i+' of '+pages, W-40, doc.internal.pageSize.getHeight()-20, {align:'right'}); }
  doc.save((fileName||safeName(title))+'.pdf');
  toast('PDF downloaded');
}
function printTables(title,defs,meta){
  const w=window.open('','_blank'); if(!w){ toast('Allow pop-ups to print'); return; }
  const tbl=d=>`<h3>${esc(d.title||'')}</h3>`+tableHTML(d).replace(/<span[^>]*>|<\/span>/g,'');
  w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;font-size:11px;padding:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}.num{text-align:right}.total-row td{font-weight:bold;background:#eef}</style></head><body>
    <h2>${esc(DB.settings.name)}</h2><h3>${esc(title)}</h3>${meta.map(m=>`<div>${esc(m)}</div>`).join('')}${defs.map(tbl).join('')}</body></html>`);
  w.document.close(); w.focus(); w.print();
}
function defToSheetAOA(def,title,meta){
  const aoa=[[DB.settings.name||'Bismillah Cafe & BBQ'],[title],...meta.map(m=>[m]),['Amounts in '+cur()],[]];
  aoa.push(def.cols.map(c=>c.label));
  const raw=(c,v)=>{ if(!isNumCol(c)) return v===undefined||v===null?'':v; if(v===null||v===undefined||v==='') return ''; return c.type==='pct'? Math.round(v*10)/10 : (c.type==='int'?Number(v):round2(v)); };
  def.rows.forEach(r=>aoa.push(def.cols.map(c=>raw(c,r[c.key]))));
  if(def.total && def.rows.length) aoa.push(def.cols.map((c,i)=>i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':raw(c,def.total[c.key]))));
  return aoa;
}
function exportExcel(sheets,fileName){
  if(typeof XLSX==='undefined'){ toast('Excel library could not load (check internet)'); return; }
  const wb=XLSX.utils.book_new();
  const used=new Set();
  sheets.forEach(s=>{
    const ws=XLSX.utils.aoa_to_sheet(defToSheetAOA(s.def,s.title,s.meta));
    ws['!cols']=s.def.cols.map(c=>({wch:Math.max(14,c.label.length+3, c.type==='text'?26:14)}));
    let nm=(s.sheet||s.def.title||'Report').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31); let n=nm,i=2; while(used.has(n)){ n=nm.slice(0,28)+' '+(i++); } used.add(n);
    XLSX.utils.book_append_sheet(wb,ws,n);
  });
  XLSX.writeFile(wb,(fileName||'report')+'.xlsx');
  toast('Excel file downloaded');
}

      <div id="xlStatus" class="muted" style="font-size:11.5px;margin-top:6px"></div></div>`;
  if(cA || (cE && editing)){
    h+=`${editing?'<div class="note">✎ Editing an existing record — change fields and click Save changes.</div>':''}
      <div class="panel"><h2 class="section-title" style="margin-top:0">${editing?'Edit record':'Add new'}</h2><form id="crudForm" class="form-grid">
      <div class="field"><label>${esc(S.fields[0].label)} <span class="tag info">auto</span></label><input type="text" value="${esc(editing?editing[S.idField]:uid(S.idPrefix,rows,S.idField,S.width))}" disabled></div>`;
    S.fields.forEach(f=>{
      if(f.key===S.idField) return;
      const cv=editing?editing[f.key]:f.default;
      h+=`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>`;
      if(f.type==='select'){
        h+=`<select name="${f.key}" ${f.required?'required':''}>${f.options?'':'<option value="">Select…</option>'}${fieldOptions(f).map(o=>`<option value="${esc(o.value)}" ${cv!==undefined&&String(cv)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
      }else{
        h+=`<input type="${f.type==='number'?'number':'text'}" name="${f.key}" value="${esc(cv===undefined?'':cv)}" ${f.step?`step="${f.step}"`:''} ${f.type==='number'?'min="0"':''} ${f.required?'required':''}>`;
      }
      h+=`</div>`;
    });
    h+=`<div class="field flexrow" style="gap:8px;flex-wrap:nowrap"><button class="btn block" type="submit">${editing?'Save changes':'Add record'}</button>
      ${editing?'<button type="button" class="btn secondary block" id="cancelEdit">Cancel</button>':''}</div></form></div>`;
  }
  h+=`<div class="flexrow" style="margin-bottom:10px"><input class="inp" id="crudSearch" placeholder="🔍 Search…" style="min-width:240px" value="${esc(crudSearch[key]||'')}"><span class="muted" id="crudCount" style="font-size:12px"></span></div>`;
  h+=`<div class="table-wrap"><table><thead><tr>${S.fields.map(f=>`<th class="${f.type==='number'?'num':''}">${esc(f.label)}</th>`).join('')}${(cE||cD)?'<th></th>':''}</tr></thead><tbody id="crudBody"></tbody></table></div>`;
  container.innerHTML=h;

  function drawRows(){
    const q=(crudSearch[key]||'').toLowerCase();
    const body=container.querySelector('#crudBody');
    const list=rows.map((r,idx)=>({r,idx})).filter(({r})=>!q || S.fields.some(f=>{ let v=r[f.key]; if(f.source) v=labelOf(DB[f.source],f.valueField,v,f.labelField); return String(v===undefined?'':v).toLowerCase().includes(q); }));
    container.querySelector('#crudCount').textContent=list.length+' of '+rows.length+' records';
    if(!list.length){ body.innerHTML=`<tr class="empty-row"><td colspan="${S.fields.length+1}">No records${cA&&!q?' yet — add one above':''}.</td></tr>`; return; }
    body.innerHTML=list.map(({r,idx})=>`<tr${idx===editIdx?' style="background:var(--gold-soft)"':''}>${S.fields.map(f=>{
      let d=r[f.key];
      if(S.display && S.display[f.key]) d=S.display[f.key](r);
      else if(f.source) d=labelOf(DB[f.source],f.valueField,d,f.labelField);
      else if(f.currency) d=money(d);
      if(f.key==='active') return `<td><span class="tag ${d==='N'?'bad':'good'}">${d==='N'?'Inactive':'Active'}</span></td>`;
      return `<td class="${f.type==='number'?'num':''}${f.key===S.idField?' mono':''}">${esc(d===undefined?'':d)}</td>`;
    }).join('')}${(cE||cD)?`<td style="white-space:nowrap">${cE?`<button class="btn small secondary" data-edit="${idx}">✎</button>`:''}${cD?`<button class="row-del" data-del="${idx}" title="Delete">✕</button>`:''}</td>`:''}</tr>`).join('');
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ renderCrud(container,key,+b.dataset.edit); window.scrollTo({top:0,behavior:'smooth'}); });
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const r=rows[+b.dataset.del];
      const why=S.inUse && S.inUse(r);
      if(why){ toast('Cannot delete — '+why+'. Set it Inactive instead.'); return; }
      if(!confirm('Delete "'+(r.name||r.id)+'"?')) return;
      rows.splice(+b.dataset.del,1); saveMaster(); renderCrud(container,key); toast('Record deleted');
    });
  }
  drawRows();
  container.querySelector('#crudSearch').addEventListener('input',e=>{ crudSearch[key]=e.target.value; drawRows(); });

  const form=container.querySelector('#crudForm');
  if(form) form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form); const rec={};
    S.fields.forEach(f=>{ if(f.key===S.idField) return; let v=fd.get(f.key); if(f.type==='number') v=(v===''||v===null)?0:parseFloat(v); else v=(v||'').trim(); rec[f.key]=v; });
    const dup=rows.find((r,i)=>i!==editIdx && String(r.name||'').trim().toLowerCase()===String(rec.name||'').toLowerCase());
    if(dup && !confirm('A record named "'+rec.name+'" already exists. Save anyway?')) return;
    if(editing){ Object.assign(editing,rec); toast('Record updated'); }
    else{ rec[S.idField]=uid(S.idPrefix,rows,S.idField,S.width); rows.push(rec); toast(rec[S.idField]+' added'); }
    saveMaster(); renderCrud(container,key);
  });
  const ce=container.querySelector('#cancelEdit'); if(ce) ce.onclick=()=>renderCrud(container,key);

  if(S.excelIO && cA){
    const st=container.querySelector('#xlStatus');
    container.querySelector('#xlTemplate').onclick=()=>{
      if(typeof XLSX==='undefined') return toast('Excel library not loaded');
      const wb=XLSX.utils.book_new();
      const ws=XLSX.utils.aoa_to_sheet([['Item Name','Category','Menu Type','Sale Price','Active (Y/N)'],['Chicken Biryani','Rice & Bread','Normal Menu',650,'Y']]);
      ws['!cols']=[{wch:30},{wch:22},{wch:20},{wch:12},{wch:12}];
      XLSX.utils.book_append_sheet(wb,ws,'Menu Items');
      const ref=[['Existing Categories','Existing Menu Types']]; const n=Math.max(DB.menuCategories.length,DB.menus.length);
      for(let i=0;i<n;i++) ref.push([(DB.menuCategories[i]||{}).name||'',(DB.menus[i]||{}).name||'']);
      const ws2=XLSX.utils.aoa_to_sheet(ref); ws2['!cols']=[{wch:26},{wch:26}];
      XLSX.utils.book_append_sheet(wb,ws2,'Reference');
      XLSX.writeFile(wb,'menu-items-template.xlsx');
    };
    container.querySelector('#xlExport').onclick=()=>{
      exportExcel([{sheet:'Menu Items',title:'Menu Items',meta:[],def:{cols:[{label:'Item ID',key:'id'},{label:'Item Name',key:'name'},{label:'Category',key:'cat'},{label:'Menu Type',key:'menu'},{label:'Sale Price',key:'price',type:'money'},{label:'Active',key:'active'}],
        rows:DB.menuItems.map(m=>({id:m.id,name:m.name,cat:catName(m.catId),menu:menuName(m.menuId),price:m.price,active:m.active||'Y'})),total:null}}],'menu-items-'+localISO());
    };
    const fi=container.querySelector('#xlFile');
    container.querySelector('#xlImport').onclick=()=>fi.click();
    fi.onchange=()=>{
      const file=fi.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onload=e=>{
        let data;
        try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}); }
        catch(err){ st.textContent='Could not read this file.'; return; }
        const find=(arr,val)=>{ const v=String(val).trim().toLowerCase(); return arr.find(r=>r.id.toLowerCase()===v || String(r.name).trim().toLowerCase()===v); };
        let added=0,updated=0; const skipped=[];
        data.forEach((row,i)=>{
          const name=String(row['Item Name']||'').trim(); const cat=String(row['Category']||'').trim(); const mt=String(row['Menu Type']||'').trim();
          const price=parseFloat(row['Sale Price']); const act=String(row['Active (Y/N)']||row['Active']||'Y').trim().toUpperCase()==='N'?'N':'Y';
          if(!name||!cat||isNaN(price)){ skipped.push('Row '+(i+2)+': name, category and price are required'); return; }
          let c=find(DB.menuCategories,cat); if(!c){ c={id:uid('MC',DB.menuCategories,'id',2),name:cat,active:'Y'}; DB.menuCategories.push(c); }
          let m=mt?find(DB.menus,mt):DB.menus[0]; if(!m){ m={id:uid('MN',DB.menus,'id',3),name:mt,active:'Y'}; DB.menus.push(m); }
          const ex=DB.menuItems.find(x=>x.name.trim().toLowerCase()===name.toLowerCase() && x.menuId===m.id);
          if(ex){ Object.assign(ex,{catId:c.id,price,active:act}); updated++; }
          else { DB.menuItems.push({id:uid('MI',DB.menuItems,'id',3),name,catId:c.id,menuId:m.id,price,active:act}); added++; }
        });
        fi.value='';
        if(added||updated) saveMaster();
        renderCrud(container,key);
        const st2=container.querySelector('#xlStatus');
        if(st2) st2.textContent=added+' added, '+updated+' updated'+(skipped.length?', '+skipped.length+' skipped — '+skipped.slice(0,4).join(' | '):'');
        toast(added+' added, '+updated+' updated');
      };
      rd.readAsArrayBuffer(file);
    };
  }
}

let _charts=[];
function destroyCharts(){ _charts.forEach(c=>{ try{c.destroy();}catch(e){} }); _charts=[]; }
function mkChart(id,cfg){ if(typeof Chart==='undefined') return; const el=document.getElementById(id); if(el) _charts.push(new Chart(el,cfg)); }
const PALETTE=['#0E5C4E','#C7622B','#B08A2E','#4E8776','#8A3A22','#2E6F5E','#D99A6C','#6B8F3A','#7A5C9E','#3A6EA5'];

function renderDashboard(c){
  destroyCharts();
  const today=localISO(); const mStart=today.slice(0,8)+'01';
  const tAgg=salesAgg({from:today,to:today},'orderType').total;
  const mF={from:mStart,to:today};
  const mAgg=salesAgg(mF,'orderType').total;
  const yAgg=salesAgg({from:addDays(today,-1),to:addDays(today,-1)},'orderType').total;
  const openShifts=DB.shiftSessions.filter(s=>s.status==='Open');
  const vs = yAgg.net? ((tAgg.net-yAgg.net)/yAgg.net*100) : null;

  c.innerHTML=`
    <h1 class="page-title">Dashboard</h1>
    <p class="page-desc">${esc(fmtDate(today))} — live snapshot of today and this month.</p>
    <h2 class="section-title" style="margin-top:0">Today</h2>
    <div class="equation">
      <div class="eq-box"><div class="label">Gross Sales</div><div class="value">${money(tAgg.gross)}</div></div>
      <div class="eq-op">−</div>
      <div class="eq-box disc"><div class="label">Discount</div><div class="value">${money(tAgg.discount)}</div></div>
      <div class="eq-op">−</div>
      <div class="eq-box disc"><div class="label">Refunds${tAgg.refunds?' ('+tAgg.refunds+')':''}</div><div class="value">${money(tAgg.refund)}</div></div>
      <div class="eq-op">=</div>
      <div class="eq-box net"><div class="label">Net Sales</div><div class="value">${money(tAgg.net)}</div></div>
    </div>
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Orders Today</div><div class="value">${tAgg.orders}</div><div class="sub">${fmtQty(tAgg.qty)} items sold</div></div>
      <div class="kpi accent"><div class="label">Avg Order Value</div><div class="value">${money(tAgg.avg)}</div></div>
      <div class="kpi gold"><div class="label">vs Yesterday</div><div class="value ${vs!==null&&vs<0?'neg-val':''}">${vs===null?'—':(vs>=0?'+':'')+vs.toFixed(1)+'%'}</div><div class="sub">Yesterday net ${money(yAgg.net)}</div></div>
      <div class="kpi"><div class="label">Month-to-date Net</div><div class="value">${money(mAgg.net)}</div><div class="sub">${mAgg.orders} orders · disc ${money(mAgg.discount)} · refunds ${money(mAgg.refund)}</div></div>
      <div class="kpi ${openShifts.length?'':'danger'}"><div class="label">Open Shifts</div><div class="value">${openShifts.length}</div><div class="sub">${openShifts.map(s=>esc(s.cashierName)).join(', ')||'No till open'}</div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>Net Sales — Last 14 Days</h3><div class="cwrap"><canvas id="chDays"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Category</h3><div class="cwrap"><canvas id="chCat"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>Top 10 Items This Month (Net)</h3><div class="cwrap"><canvas id="chItems"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Hour</h3><div class="cwrap"><canvas id="chHour"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>This Month by Order Type</h3><div class="cwrap"><canvas id="chType"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Menu Type</h3><div class="cwrap"><canvas id="chMenu"></canvas></div></div>
    </div>`;

  const days=[]; for(let i=13;i>=0;i--) days.push(addDays(today,-i));
  const dAgg=salesAgg({from:days[0],to:today},'date').rows;
  const dMap=Object.fromEntries(dAgg.map(r=>[r.key,r.net]));
  const opt=()=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}});
  mkChart('chDays',{type:'bar',data:{labels:days.map(d=>d.slice(8)+' '+MONTHS[+d.slice(5,7)-1]),datasets:[{label:'Net Sales',data:days.map(d=>dMap[d]||0),backgroundColor:PALETTE[0]}]},options:opt()});
  const cat=salesAgg(mF,'category').rows;
  mkChart('chCat',{type:'doughnut',data:{labels:cat.map(r=>r.name),datasets:[{data:cat.map(r=>r.net),backgroundColor:PALETTE}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
  const items=salesAgg(mF,'item').rows.slice(0,10);
  mkChart('chItems',{type:'bar',data:{labels:items.map(r=>r.name),datasets:[{label:'Net',data:items.map(r=>r.net),backgroundColor:PALETTE[1]}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}});
  const hrs=salesAgg(mF,'time').rows;
  mkChart('chHour',{type:'bar',data:{labels:hrs.map(r=>r.name.split(' – ')[0]),datasets:[{label:'Net',data:hrs.map(r=>r.net),backgroundColor:PALETTE[2]}]},options:opt()});
  const ot=salesAgg(mF,'orderType').rows;
  mkChart('chType',{type:'bar',data:{labels:ot.map(r=>r.name),datasets:[{label:'Net',data:ot.map(r=>r.net),backgroundColor:PALETTE[3]}]},options:opt()});
  const mt=salesAgg(mF,'menuType').rows;
  mkChart('chMenu',{type:'pie',data:{labels:mt.map(r=>r.name),datasets:[{data:mt.map(r=>r.net),backgroundColor:PALETTE}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}

function resetPOS(){ POS.cart=[]; POS.editingId=null; POS.customer={name:'',contact:'',address:''}; POS.discId='DC00'; POS.pay='Cash'; POS.tendered=''; POS.orderType='Dine In'; }
function canModifyOrder(o,action){
  if(refundsOfOrder(o.id).length) return false; // refunded orders are locked — void the refund first
  if(isAdmin()) return true;
  const ss=byId(DB.shiftSessions,'id',o.shiftSessionId);
  if(!ss || ss.status!=='Open') return false;
  return action==='del'?canDel('pos'):canEdit('pos');
}

async function openShiftFor(shiftName,openingCash){
  if(myOpenShift()){ toast('You already have an open shift'); return null; }
  const id=await nextId('shift','SS',DB.shiftSessions,4);
  const s={id,cashierId:currentUser.id,cashierName:currentUser.name,shiftName,date:localISO(),openTime:nowTime(),
    openingCash:Number(openingCash)||0,status:'Open',closeDate:null,closeTime:null,countedCash:0,denoms:{},coins:0,remarks:''};
  if(isTestMode()) s.test=true;
  await saveShift(s).catch(()=>{});
  toast('Shift '+id+' opened');
  return s;
}
function openShiftFormHTML(){
  return `<div class="form-grid" style="max-width:560px">
    <div class="field"><label>Shift</label><select id="osName">${SHIFT_NAMES.map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Opening Cash (${esc(cur())})</label><input type="number" id="osCash" value="0" min="0" step="1"></div>
    <div class="field"><button class="btn block" id="osBtn">Open Shift</button></div></div>`;
}
function wireOpenShift(root,after){
  const b=root.querySelector('#osBtn'); if(!b) return;
  b.onclick=async()=>{ b.disabled=true; const s=await openShiftFor(root.querySelector('#osName').value, parseFloat(root.querySelector('#osCash').value)||0); b.disabled=false; if(s) after(); };
}
