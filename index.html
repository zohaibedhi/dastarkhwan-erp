    g.innerHTML=items.length?items.map(m=>`<div class="menu-card" data-id="${m.id}"><div class="cat">${esc(catName(m.catId))}</div><div class="nm">${esc(m.name)}</div><div class="pr">${money(m.price)}</div></div>`).join('')
      :'<p class="muted" style="padding:18px;font-size:12.5px">No items match.</p>';
    g.querySelectorAll('.menu-card').forEach(el=>el.onclick=()=>{
      const mi=itemOf(el.dataset.id); if(!mi) return;
      const line=POS.cart.find(x=>x.itemId===mi.id && x.price===Number(mi.price));
      if(line) line.qty++; else POS.cart.push({itemId:mi.id,name:mi.name,catId:mi.catId,menuId:mi.menuId,price:Number(mi.price)||0,qty:1});
      drawCart();
    });
  }
  function totals(){
    const gross=linesGross(POS.cart);
    const disc=calcDiscount(gross,byId(DB.discounts,'id',POS.discId));
    return {gross,disc,net:round2(gross-disc)};
  }
  function drawCart(){
    const w=c.querySelector('#cartItems');
    if(!POS.cart.length) w.innerHTML='<p class="muted" style="font-size:12.5px;margin:8px 0">No items yet — tap a menu card to add.</p>';
    else{
      w.innerHTML=POS.cart.map((l,i)=>`<div class="cart-item"><span class="ci-name">${esc(l.name)}<small>${fmtNum(l.price,2)} × ${l.qty} = ${fmtNum(l.price*l.qty,2)}</small></span>
        <span class="qtybox"><button data-i="${i}" data-d="-1">−</button><b>${l.qty}</b><button data-i="${i}" data-d="1">+</button><button data-i="${i}" data-d="x" style="color:var(--danger)">✕</button></span></div>`).join('');
      w.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i; if(b.dataset.d==='x') POS.cart.splice(i,1); else { POS.cart[i].qty+=+b.dataset.d; if(POS.cart[i].qty<=0) POS.cart.splice(i,1); }
        drawCart();
      });
    }
    const t=totals();
    c.querySelector('#cGross').textContent=money(t.gross);
    c.querySelector('#cDisc').textContent='-'+money(t.disc);
    c.querySelector('#cNet').textContent=money(t.net);
    const tend=parseFloat(POS.tendered);
    const row=c.querySelector('#cChangeRow');
    if(POS.pay==='Cash' && tend>0 && POS.cart.length){ row.style.display=''; const ch=tend-t.net; c.querySelector('#cChange').textContent=ch<0?'Short '+money(-ch):money(ch); c.querySelector('#cChange').style.color=ch<0?'var(--danger)':'var(--good)'; }
    else row.style.display='none';
  }
  function drawOrders(){
    const ssNow=byId(DB.shiftSessions,'id',ss.id)||ss;
    const os=shiftOrders(ss.id).slice().sort((a,b)=>(b.date+b.time+b.id).localeCompare(a.date+a.time+a.id));
    const st=shiftStats(ssNow);
    c.querySelector('#shiftLive').innerHTML=`${st.orders} orders${st.refunds?' · '+st.refunds+' refunds':''} · Net <b>${money(st.net)}</b>`;
    const w=c.querySelector('#shiftOrders');
    const rs=shiftRefunds(ss.id).slice().sort((a,b)=>(b.date+b.time+b.id).localeCompare(a.date+a.time+a.id));
    const rw=c.querySelector('#shiftRefunds');
    rw.innerHTML=rs.length?`<h2 class="section-title">Refunds in this shift</h2><div class="table-wrap"><table><thead><tr><th>Refund #</th><th>Time</th><th>Order #</th><th>Items</th><th>Reason</th><th>Method</th><th class="num">Refunded</th><th></th></tr></thead><tbody>
      ${rs.map(r=>`<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.time)}</td><td class="mono">${esc(r.orderId)}</td><td style="white-space:normal">${esc(r.items.map(l=>l.qty+'× '+l.name).join(', '))}</td>
        <td>${esc(r.reason)}</td><td>${esc(r.payMethod)}</td><td class="num bold" style="color:var(--danger)">-${money(r.net)}</td>
        <td style="white-space:nowrap"><button class="btn small secondary" data-rprint="${r.id}">Print</button>${canVoidRefund(r)?` <button class="row-del" data-void="${r.id}" title="Void refund">✕</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`:'';
    rw.querySelectorAll('[data-rprint]').forEach(b=>b.onclick=()=>showRefundReceipt(byId(DB.refunds,'id',b.dataset.rprint)));
    rw.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidRefund(b.dataset.void,()=>renderPOSPage(c)));
    if(!os.length){ w.innerHTML='<p class="muted">No orders in this shift yet.</p>'; return; }
    w.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Order #</th><th>Time</th><th>Type</th><th class="num">Items</th><th class="num">Gross</th><th class="num">Discount</th><th class="num">Net</th><th>Payment</th><th></th></tr></thead><tbody>
      ${os.map(o=>`<tr${o.id===POS.editingId?' style="background:var(--gold-soft)"':''}><td class="mono">${esc(o.id)}${o._unsynced?' <span class="tag warn" title="Not yet synced to cloud">⏳</span>':''}${refundTag(o)}</td><td>${esc(o.time)}</td><td>${esc(o.orderType)}</td>
        <td class="num">${fmtQty(o.items.reduce((s,l)=>s+l.qty,0))}</td><td class="num">${money(o.gross)}</td><td class="num">${money(o.discount)}</td><td class="num bold">${money(o.net)}</td><td>${esc(o.payMethod)}</td>
        <td style="white-space:nowrap"><button class="btn small secondary" data-print="${o.id}">Print</button>
          ${canModifyOrder(o,'edit')?`<button class="btn small secondary" data-edit="${o.id}">✎</button>`:''}
          ${canAdd('refunds') && refundableLines(o).some(x=>x.left>0)?`<button class="btn small danger" data-refund="${o.id}" title="Refund this order">↩ Refund</button>`:''}
          ${canModifyOrder(o,'del')?`<button class="row-del" data-del="${o.id}" title="Delete order">✕</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`;
    w.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>showReceipt(byId(DB.orders,'id',b.dataset.print)));
    w.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>loadForEdit(b.dataset.edit));
    w.querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>openRefundModal(b.dataset.refund,()=>renderPOSPage(c)));
    w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      if(!confirm('Delete order '+b.dataset.del+'? This removes it from all reports.')) return;
      if(POS.editingId===b.dataset.del) resetPOS();
      removeOrder(b.dataset.del); toast('Order deleted'); renderPOSPage(c);
    });
  }
  function loadForEdit(id){
    const o=byId(DB.orders,'id',id); if(!o) return;
    POS.editingId=id; POS.cart=o.items.map(l=>Object.assign({},l));
    POS.orderType=o.orderType; POS.discId=o.discId; POS.pay=o.payMethod; POS.tendered=o.tendered||'';
    POS.customer=Object.assign({name:'',contact:'',address:''},o.customer||{});
    renderPOSPage(c); window.scrollTo({top:0,behavior:'smooth'});
  }
  function syncEditUI(){
    const ban=c.querySelector('#posEditBanner'), btn=c.querySelector('#completeBtn'), clr=c.querySelector('#clearBtn');
    if(POS.editingId){ ban.style.display='block'; ban.textContent='✎ Editing order '+POS.editingId+' — change items/discount/payment, then Save.'; btn.textContent='Save changes to '+POS.editingId; clr.textContent='Cancel edit'; }
    else { ban.style.display='none'; btn.textContent='Complete Sale & Print'; clr.textContent='Clear'; }
  }

  c.querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ POS.tab=t.dataset.tab;
    c.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===t));
    c.querySelector('#tabOrder').style.display=POS.tab==='order'?'':'none'; c.querySelector('#tabCustomer').style.display=POS.tab==='customer'?'':'none'; });
  c.querySelector('#fMenu').onchange=e=>{ POS.filters.menu=e.target.value; drawMenu(); };
  c.querySelector('#fCat').onchange=e=>{ POS.filters.cat=e.target.value; drawMenu(); };
  c.querySelector('#fQ').oninput=e=>{ POS.filters.q=e.target.value; drawMenu(); };
  c.querySelectorAll('#segType button').forEach(b=>b.onclick=()=>{ POS.orderType=b.dataset.v; c.querySelectorAll('#segType button').forEach(x=>x.classList.toggle('on',x===b)); });
  c.querySelectorAll('#segPay button').forEach(b=>b.onclick=()=>{ POS.pay=b.dataset.v; c.querySelectorAll('#segPay button').forEach(x=>x.classList.toggle('on',x===b)); c.querySelector('#tenderWrap').style.display=POS.pay==='Cash'?'':'none'; drawCart(); });
  c.querySelector('#posDisc').onchange=e=>{ POS.discId=e.target.value; drawCart(); };
  c.querySelector('#posTender').oninput=e=>{ POS.tendered=e.target.value; drawCart(); };
  [['cuName','name'],['cuContact','contact'],['cuAddress','address']].forEach(([id,k])=>c.querySelector('#'+id).oninput=e=>{ POS.customer[k]=e.target.value; });
  c.querySelector('#clearBtn').onclick=()=>{ resetPOS(); renderPOSPage(c); };
  c.querySelector('#xRptBtn').onclick=()=>showZReport(ss.id);
  const rb=c.querySelector('#refundsBtn'); if(rb) rb.onclick=()=>navigateTo('refunds');
  c.querySelector('#closeShiftBtn').onclick=()=>openCloseShiftModal(ss.id,()=>renderPOSPage(c));

  c.querySelector('#completeBtn').onclick=async()=>{
    if(POS.saving) return;
    if(!POS.cart.length){ toast('Add at least one item first'); return; }
    const t=totals();
    const tend=parseFloat(POS.tendered)||0;
    if(POS.pay==='Cash' && tend>0 && tend<t.net){ toast('Cash received is less than the net payable'); return; }
    const disc=byId(DB.discounts,'id',POS.discId);
    const cust={name:POS.customer.name.trim(),contact:POS.customer.contact.trim(),address:POS.customer.address.trim()};
    const hasCust=cust.name||cust.contact||cust.address;
    const common={orderType:POS.orderType,discId:disc?disc.id:'',discName:disc?disc.name:'',discType:disc?disc.type:'',discValue:disc?Number(disc.value)||0:0,
      payMethod:POS.pay,items:POS.cart.map(l=>Object.assign({},l)),gross:t.gross,discount:t.disc,net:t.net,
      tendered:POS.pay==='Cash'&&tend>0?tend:null,change:POS.pay==='Cash'&&tend>0?round2(tend-t.net):null,customer:hasCust?cust:null,status:'Paid'};
    POS.saving=true; const btn=c.querySelector('#completeBtn'); btn.disabled=true;
    try{
      let order;
      if(POS.editingId){
        order=byId(DB.orders,'id',POS.editingId);
        if(!order){ toast('Order no longer exists'); resetPOS(); renderPOSPage(c); return; }
        Object.assign(order,common,{editedAt:localISO()+' '+nowTime(),editedBy:currentUser.name});
        saveOrder(order); toast('Order '+order.id+' updated');
      }else{
        const id=await nextId('order','ORD',DB.orders,5);
        order=Object.assign({id,date:localISO(),time:nowTime(),shiftSessionId:ss.id,shiftName:ss.shiftName,cashierId:currentUser.id,cashierName:currentUser.name},common,isTestMode()?{test:true}:{});
        saveOrder(order); toast('Order '+id+' completed');
      }
      resetPOS(); POS.tab='order';
      renderPOSPage(c);
      showReceipt(order);
    }finally{ POS.saving=false; }
  };

  drawMenu(); drawCart(); drawOrders(); syncEditUI();
  window._posRefresh=()=>{ if(!myOpenShift()){ renderPOSPage(c); return; } drawOrders(); };
}

    ${s.address?`<div class="c">${esc(s.address)}</div>`:''}${s.phone?`<div class="c">Tel: ${esc(s.phone)}</div>`:''}

    <div class="receipt-line"><span>${esc(o.orderType)}</span><span>${esc(o.shiftName||'')} shift</span></div>

    <hr>

    <hr>

    <div class="receipt-line" style="font-weight:700;font-size:13px"><span>NET PAYABLE</span><span>${esc(cur())} ${fmtNum(o.net,2)}</span></div>
    <hr>
    <div class="receipt-line"><span>Paid by</span><span>${esc(o.payMethod)}</span></div>

    <div class="c" style="margin-top:10px">${esc(s.footer||'')}</div>
    ${isTestMode()||o.test?'<hr><div class="c" style="font-weight:700">*** TEST MODE ***<br>NOT A VALID RECEIPT</div>':''}`;
  document.getElementById('receiptModal').classList.add('show');
}

/* =====================================================================
   SECTION 9b — REFUNDS
   A refund is a credit note linked to the original order. It is paid out
   of the refunding cashier's OPEN shift, so it reduces that shift's cash
   and appears in reports on the day it was paid.
   ===================================================================== */
const REFUND_REASONS=['Customer complaint','Wrong item served','Quality issue','Order cancelled','Overcharged','Other'];
function refundableLines(o){
  return o.items.map((l,i)=>{ const done=refundedQty(o.id,l.itemId,l.price); return {i,l,done,left:Math.max(0,(Number(l.qty)||0)-done)}; });
}
function canVoidRefund(r){
  if(isAdmin()) return true;
  if(!canDel('refunds')) return false;
  const ss=byId(DB.shiftSessions,'id',r.shiftSessionId);
  return !!(ss && ss.status==='Open');
}
function openRefundModal(orderId,after){
  const o=byId(DB.orders,'id',orderId);
  if(!o){ toast('Order not found'); return; }
  if(!canAdd('refunds')){ toast('You don\'t have permission to make refunds — ask a manager'); return; }
  const ss=myOpenShift();
  if(!ss){ toast('Open your shift first — refund money is paid out of your till'); return; }
  const lines=refundableLines(o);
  if(lines.every(x=>x.left<=0)){ toast('Order '+o.id+' is already fully refunded'); return; }
  const prev=refundsOfOrder(o.id);
  const prevNet=round2(prev.reduce((a,r)=>a+(Number(r.net)||0),0));
  const prevDisc=round2(prev.reduce((a,r)=>a+(Number(r.discount)||0),0));
  const m=openModal(`
    <h3>↩ Refund order ${esc(o.id)}</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px">${esc(fmtDate(o.date))} ${esc(o.time)} · ${esc(o.orderType)} · paid by ${esc(o.payMethod)} · ${esc(o.cashierName||'')}<br>
      Order net <b>${money(o.net)}</b>${o.discount>0?` (incl. discount ${money(o.discount)} — ${esc(o.discName||'')})`:''}${prev.length?` · already refunded <b>${money(prevNet)}</b> in ${prev.map(r=>esc(r.id)).join(', ')}`:''}</p>
    <div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Price</th><th class="num">Sold</th><th class="num">Refunded</th><th class="num">Refund Qty</th><th class="num">Value</th></tr></thead><tbody>
      ${lines.map(x=>`<tr${x.left<=0?' style="opacity:.5"':''}><td>${esc(x.l.name)}</td><td class="num">${fmtNum(x.l.price,2)}</td><td class="num">${fmtQty(x.l.qty)}</td><td class="num">${fmtQty(x.done)}</td>
        <td class="num"><input type="number" class="inp rfq" data-i="${x.i}" min="0" max="${x.left}" step="1" value="0" ${x.left<=0?'disabled':''} style="width:74px;text-align:right"></td>
        <td class="num" id="rfv${x.i}">0.00</td></tr>`).join('')}
    </tbody></table></div>
    <div class="flexrow" style="margin:8px 0 12px"><button class="btn small secondary" id="rfAll">Select everything remaining</button><button class="btn small secondary" id="rfNone">Clear</button></div>
    <div class="form-grid">
      <div class="field"><label>Reason *</label><select id="rfReason">${REFUND_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Refund paid by</label><select id="rfMethod">${PAY_METHODS.map(p=>`<option ${p===o.payMethod?'selected':''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Note (optional)</label><input id="rfNote" placeholder="e.g. Karahi was cold, customer returned it"></div>
    <div style="margin-top:8px;max-width:340px;margin-left:auto">
      <div class="cart-total-row"><span>Items value</span><span id="rfGross">0.00</span></div>
      <div class="cart-total-row"><span>Less: discount share</span><span id="rfDisc">0.00</span></div>
      <div class="cart-total-row grand" style="color:var(--danger)"><span>Refund to customer</span><span id="rfNet">${money(0)}</span></div>
    </div>
    <p class="muted" style="font-size:11.5px;margin:8px 0 0">Paid from your open shift <b>${esc(ss.id)}</b> (${esc(ss.shiftName)}). Cash refunds reduce the expected cash in your till.</p>
    <div id="rfErr" style="color:var(--danger);font-size:12px;margin-top:6px"></div>
    <div class="modal-actions"><button class="btn secondary" id="rfCancel">Cancel</button><button class="btn danger" id="rfOk" disabled>Refund</button></div>`, 680);
  const calc=()=>{
    const items=[]; let allDone=true;
    lines.forEach(x=>{
      const inp=m.querySelector(`.rfq[data-i="${x.i}"]`);
      let q=Math.floor(parseFloat(inp.value)||0); if(q<0) q=0; if(q>x.left){ q=x.left; inp.value=q; }
      m.querySelector('#rfv'+x.i).textContent=fmtNum(q*x.l.price,2);
      if(q>0) items.push(Object.assign({},x.l,{qty:q}));
      if(x.left-q>0) allDone=false;
    });
    const g=linesGross(items);
    let d = allDone ? round2((Number(o.discount)||0)-prevDisc) : (o.gross? round2((Number(o.discount)||0)*g/o.gross) : 0);
    d=Math.max(0,Math.min(d,g));
    let net=round2(g-d);
    if(allDone) net=round2((Number(o.net)||0)-prevNet);
    net=Math.max(0,Math.min(net, round2((Number(o.net)||0)-prevNet)));
    d=round2(g-net);
    m.querySelector('#rfGross').textContent=fmtNum(g,2);
    m.querySelector('#rfDisc').textContent='-'+fmtNum(d,2);
    m.querySelector('#rfNet').textContent=money(net);
    const ok=m.querySelector('#rfOk'); ok.disabled=!items.length; ok.textContent=items.length?'Refund '+money(net):'Refund';
    return {items,g,d,net};
  };
  m.querySelectorAll('.rfq').forEach(i=>i.oninput=calc);
  m.querySelector('#rfAll').onclick=()=>{ lines.forEach(x=>{ const i=m.querySelector(`.rfq[data-i="${x.i}"]`); if(!i.disabled) i.value=x.left; }); calc(); };
  m.querySelector('#rfNone').onclick=()=>{ m.querySelectorAll('.rfq').forEach(i=>i.value=0); calc(); };
  m.querySelector('#rfCancel').onclick=closeModal;
  m.querySelector('#rfOk').onclick=async()=>{
    const r=calc(); if(!r.items.length) return;
    const ok=m.querySelector('#rfOk'); ok.disabled=true; ok.textContent='Saving…';
    if(!confirm('Refund '+money(r.net)+' to the customer by '+m.querySelector('#rfMethod').value+'?')){ ok.disabled=false; calc(); return; }
    const id=await nextId('refund','RF',DB.refunds,5);
    const rf={id,date:localISO(),time:nowTime(),orderId:o.id,orderDate:o.date,orderTime:o.time,orderType:o.orderType,origPayMethod:o.payMethod,
      payMethod:m.querySelector('#rfMethod').value,shiftSessionId:ss.id,shiftName:ss.shiftName,cashierId:currentUser.id,cashierName:currentUser.name,
      items:r.items,gross:r.g,discount:r.d,net:r.net,reason:m.querySelector('#rfReason').value,note:m.querySelector('#rfNote').value.trim()};
    if(isTestMode()) rf.test=true;
    saveRefund(rf);
    closeModal(); toast('Refund '+id+' saved — '+money(r.net));
    if(after) after();
    showRefundReceipt(rf);
  };
  calc();
}
function showRefundReceipt(r){
  const s=DB.settings;
  document.getElementById('receiptPaper').innerHTML=`
    <h4>${esc((s.name||'').toUpperCase())}</h4>
    ${s.address?`<div class="c">${esc(s.address)}</div>`:''}${s.phone?`<div class="c">Tel: ${esc(s.phone)}</div>`:''}
    <hr><div class="c" style="font-weight:700;font-size:13px">REFUND / CREDIT NOTE</div><hr>
    <div class="receipt-line"><span>Refund #</span><b>${esc(r.id)}</b></div>
    <div class="receipt-line"><span>${esc(fmtDate(r.date))}</span><span>${esc(r.time)}</span></div>
    <div class="receipt-line"><span>Original order</span><span>${esc(r.orderId)}</span></div>
    <div class="receipt-line"><span>Order date</span><span>${esc(fmtDate(r.orderDate))} ${esc(r.orderTime||'')}</span></div>
    <div class="receipt-line"><span>Cashier</span><span>${esc(r.cashierName)}</span></div>
    <hr>
    ${r.items.map(l=>`<div class="receipt-line"><span>${l.qty} x ${esc(l.name)}</span><span>-${fmtNum(l.qty*l.price,2)}</span></div>`).join('')}
    <hr>
    <div class="receipt-line"><span>Items value</span><span>${fmtNum(r.gross,2)}</span></div>
    <div class="receipt-line"><span>Less discount share</span><span>-${fmtNum(r.discount,2)}</span></div>
    <div class="receipt-line" style="font-weight:700;font-size:13px"><span>REFUNDED</span><span>${esc(cur())} ${fmtNum(r.net,2)}</span></div>
    <hr>
    <div class="receipt-line"><span>Refunded by</span><span>${esc(r.payMethod)}</span></div>
    <div>Reason: ${esc(r.reason)}${r.note?' — '+esc(r.note):''}</div>
    <div style="margin-top:22px">Customer sign: ____________________</div>
    ${isTestMode()||r.test?'<hr><div class="c" style="font-weight:700">*** TEST MODE ***<br>NOT A VALID DOCUMENT</div>':''}`;
  document.getElementById('receiptModal').classList.add('show');
}
function voidRefund(id,after){
  const r=byId(DB.refunds,'id',id); if(!r) return;
  if(!canVoidRefund(r)){ toast('This refund\'s shift is closed — only an Admin can void it'); return; }
  if(!confirm('Void refund '+id+' ('+money(r.net)+')? The items become refundable again and reports go back to the original sale.')) return;
  removeRefund(id); toast('Refund '+id+' voided'); if(after) after();
}

const RFS={q:'',preset:'month',from:'',to:''};
function renderRefundsPage(c){
  const S=RFS; if(!S.from){ [S.from,S.to]=presetRange('month'); }
  const cA=canAdd('refunds');
  c.innerHTML=`
    <h1 class="page-title">Refunds</h1>
    <p class="page-desc">Refund a whole order or selected items. A refund is paid from the refunding cashier's open shift and is deducted in every report: <b>Gross Sales − Discount − Refunds = Net Sales</b>.</p>
    ${cA?`<div class="panel">
      <h2 class="section-title" style="margin-top:0">Refund an order</h2>
      ${myOpenShift()?'':'<div class="note">You need an open shift to pay out a refund. <a href="#" id="rfOpenShift" style="font-weight:700">Open a shift →</a></div>'}
      <div class="flexrow" style="margin-bottom:10px"><input class="inp" id="rfQ" placeholder="🔍 Order # (e.g. ORD00042) or customer name / phone" style="flex:1;min-width:260px" value="${esc(S.q)}" autocomplete="off">
        <span class="muted" style="font-size:12px">Showing the last 7 days unless you search.</span></div>
      <div id="rfFind"></div></div>`:''}
    <h2 class="section-title">Refund history</h2>
    <div class="panel" style="padding:14px 16px"><div class="form-grid">
      <div class="field"><label>Period</label><select id="hPreset">${PRESETS.map(p=>`<option value="${p[0]}" ${S.preset===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
      <div class="field"><label>From</label><input type="date" id="hFrom" value="${S.from}"></div>
      <div class="field"><label>To</label><input type="date" id="hTo" value="${S.to}"></div>
      <div class="field"><div class="flexrow"><button class="btn small secondary" id="hPdf">⬇ PDF</button><button class="btn small secondary" id="hXls">⬇ Excel</button></div></div>
    </div></div>
    <div id="rfHist"></div>`;
  const drawFind=()=>{
    const w=c.querySelector('#rfFind'); if(!w) return;
    const q=S.q.trim().toLowerCase(); const since=addDays(localISO(),-6);
    let list=validOrders().filter(o=> q ? (o.id.toLowerCase().includes(q) || (o.customer && ((o.customer.name||'').toLowerCase().includes(q) || (o.customer.contact||'').toLowerCase().includes(q)))) : o.date>=since);
    list=list.sort((a,b)=>(b.date+b.time+b.id).localeCompare(a.date+a.time+a.id)).slice(0,40);
    if(!list.length){ w.innerHTML='<p class="muted">No matching orders.</p>'; return; }
    w.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Order #</th><th>Date</th><th>Time</th><th>Type</th><th>Customer</th><th class="num">Net</th><th>Payment</th><th>Cashier</th><th></th></tr></thead><tbody>
      ${list.map(o=>{ const can=refundableLines(o).some(x=>x.left>0); return `<tr><td class="mono">${esc(o.id)}${refundTag(o)}</td><td>${esc(fmtDate(o.date))}</td><td>${esc(o.time)}</td><td>${esc(o.orderType)}</td>
        <td>${esc(o.customer&&o.customer.name||'')}</td><td class="num">${money(o.net)}</td><td>${esc(o.payMethod)}</td><td>${esc(o.cashierName||'')}</td>
        <td style="white-space:nowrap"><button class="btn small secondary" data-print="${o.id}">Receipt</button> ${can?`<button class="btn small danger" data-refund="${o.id}">↩ Refund</button>`:''}</td></tr>`; }).join('')}
      </tbody></table></div>`;
    w.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>showReceipt(byId(DB.orders,'id',b.dataset.print)));
    w.querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>openRefundModal(b.dataset.refund,()=>renderRefundsPage(c)));
  };
  const build=()=>{
    const list=DB.refunds.filter(r=>r.date>=S.from && r.date<=S.to).sort((a,b)=>(a.date+a.time+a.id).localeCompare(b.date+b.time+b.id));
    const rows=list.map(r=>({id:r.id,date:fmtDate(r.date),time:r.time,order:r.orderId,orderDate:fmtDate(r.orderDate),cashier:r.cashierName,shift:r.shiftName,reason:r.reason+(r.note?' — '+r.note:''),
      method:r.payMethod,qty:r.items.reduce((a,l)=>a+(Number(l.qty)||0),0),items:r.items.map(l=>l.qty+'× '+l.name).join(', '),gross:r.gross,discount:r.discount,net:r.net}));
    const sum=k=>round2(rows.reduce((a,r)=>a+(Number(r[k])||0),0));
    const detail={title:'Refund Detail',cols:[{label:'Refund #',key:'id'},{label:'Date',key:'date'},{label:'Time',key:'time'},{label:'Order #',key:'order'},{label:'Order Date',key:'orderDate'},
      {label:'Items',key:'items'},{label:'Reason',key:'reason'},{label:'Method',key:'method'},{label:'Cashier',key:'cashier'},{label:'Qty',key:'qty',type:'qty'},
      {label:'Items Value',key:'gross',type:'money'},{label:'Disc. Share',key:'discount',type:'money'},{label:'Refunded',key:'net',type:'money'}],
      rows,total:{qty:sum('qty'),gross:sum('gross'),discount:sum('discount'),net:sum('net')},empty:'No refunds in this period.'};
    const byR={}; list.forEach(r=>{ byR[r.reason]=byR[r.reason]||{reason:r.reason,count:0,qty:0,net:0}; const x=byR[r.reason]; x.count++; x.qty+=r.items.reduce((a,l)=>a+(Number(l.qty)||0),0); x.net+=Number(r.net)||0; });
    const totNet=sum('net');
    const reasonRows=Object.values(byR).sort((a,b)=>b.net-a.net).map(x=>Object.assign(x,{net:round2(x.net),share:totNet?x.net/totNet*100:0}));
    const byReason={title:'Refunds by Reason',cols:[{label:'Reason',key:'reason'},{label:'Refunds',key:'count',type:'int'},{label:'Qty',key:'qty',type:'qty'},{label:'Amount',key:'net',type:'money'},{label:'% of Refunds',key:'share',type:'pct'}],
      rows:reasonRows,total:{count:rows.length,qty:sum('qty'),net:totNet,share:totNet?100:0},empty:'No refunds in this period.'};
    return {list,detail,byReason,meta:reportMeta([periodText(S)])};
  };
  const drawHist=()=>{
    const r=build(); const sales=salesAgg({from:S.from,to:S.to},'orderType').total;
    c.querySelector('#rfHist').innerHTML=`
      <div class="grid-kpi" style="margin-bottom:14px">
        <div class="kpi danger"><div class="label">Refunded</div><div class="value">${money(r.detail.total.net)}</div><div class="sub">${r.list.length} refunds · ${fmtQty(r.detail.total.qty)} items</div></div>
        <div class="kpi"><div class="label">Refund rate</div><div class="value">${sales.gross-sales.discount>0?(r.detail.total.net/(sales.gross-sales.discount)*100).toFixed(1)+'%':'—'}</div><div class="sub">of sales after discount</div></div>
        <div class="kpi"><div class="label">Cash refunds</div><div class="value">${money(r.list.filter(x=>x.payMethod==='Cash').reduce((a,x)=>a+x.net,0))}</div></div>
      </div>
      ${tableHTML(r.byReason)}
      <h2 class="section-title">Refunds</h2>
      ${r.list.length?`<div class="table-wrap"><table><thead><tr><th>Refund #</th><th>Date</th><th>Order #</th><th>Items</th><th>Reason</th><th>Method</th><th>Cashier</th><th class="num">Refunded</th><th></th></tr></thead><tbody>
        ${r.list.slice().reverse().map(x=>`<tr><td class="mono">${esc(x.id)}${x._unsynced?' <span class="tag warn">⏳</span>':''}</td><td>${esc(fmtDate(x.date))} ${esc(x.time)}</td><td class="mono">${esc(x.orderId)}</td>
          <td style="white-space:normal;min-width:180px">${esc(x.items.map(l=>l.qty+'× '+l.name).join(', '))}</td><td>${esc(x.reason)}${x.note?`<br><small class="muted">${esc(x.note)}</small>`:''}</td>
          <td>${esc(x.payMethod)}</td><td>${esc(x.cashierName)}</td><td class="num bold" style="color:var(--danger)">${money(x.net)}</td>
          <td style="white-space:nowrap"><button class="btn small secondary" data-rprint="${x.id}">Print</button>${canVoidRefund(x)?` <button class="row-del" data-void="${x.id}" title="Void refund">✕</button>`:''}</td></tr>`).join('')}
        <tr class="total-row"><td colspan="7">TOTAL</td><td class="num">${money(r.detail.total.net)}</td><td></td></tr></tbody></table></div>`:'<p class="muted">No refunds in this period.</p>'}`;
    c.querySelectorAll('[data-rprint]').forEach(b=>b.onclick=()=>showRefundReceipt(byId(DB.refunds,'id',b.dataset.rprint)));
    c.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidRefund(b.dataset.void,()=>renderRefundsPage(c)));
  };
  const q=c.querySelector('#rfQ'); if(q) q.oninput=e=>{ S.q=e.target.value; drawFind(); };
  const os=c.querySelector('#rfOpenShift'); if(os) os.onclick=e=>{ e.preventDefault(); navigateTo('shifts'); };
  const upd=()=>{ S.preset=c.querySelector('#hPreset').value; S.from=c.querySelector('#hFrom').value; S.to=c.querySelector('#hTo').value; drawHist(); };
  c.querySelector('#hPreset').onchange=e=>{ const r=presetRange(e.target.value); if(r){ c.querySelector('#hFrom').value=r[0]; c.querySelector('#hTo').value=r[1]; } upd(); };
  ['#hFrom','#hTo'].forEach(id=>c.querySelector(id).onchange=()=>{ c.querySelector('#hPreset').value='custom'; upd(); });
  c.querySelector('#hPdf').onclick=()=>{ const r=build(); exportPDF('Refunds Report',[r.byReason,r.detail],r.meta,'refunds-'+S.from+'-to-'+S.to); };
  c.querySelector('#hXls').onclick=()=>{ const r=build(); exportExcel([{sheet:'By Reason',title:'Refunds by Reason',meta:r.meta,def:r.byReason},{sheet:'Refund Detail',title:'Refund Detail',meta:r.meta,def:r.detail}],'refunds-'+S.from+'-to-'+S.to); };
  drawFind(); drawHist();
}

function openCloseShiftModal(ssId,after){
  const ss=byId(DB.shiftSessions,'id',ssId); if(!ss) return;
  const st=shiftStats(ss);
  const m=openModal(`
    <h3>Close Shift ${esc(ss.id)} — Cash Count</h3>
    <p class="muted" style="font-size:12px;margin:0 0 12px">${esc(ss.cashierName)} · ${esc(ss.shiftName)} · ${st.orders} orders · Net ${money(st.net)}</p>
    <table><thead><tr><th>Note</th><th class="num">Count</th><th class="num">Amount</th></tr></thead><tbody>
      ${DENOMS.map(d=>`<tr><td>${esc(cur())} ${d.toLocaleString()}</td><td class="num"><input type="number" class="inp dn" data-d="${d}" min="0" step="1" value="${(ss.denoms||{})[d]||0}" style="width:80px;text-align:right"></td><td class="num" id="da${d}">0</td></tr>`).join('')}
      <tr><td>Coins / loose (amount)</td><td class="num"><input type="number" class="inp" id="dnCoins" min="0" step="1" value="${ss.coins||0}" style="width:80px;text-align:right"></td><td class="num" id="daCoins">0</td></tr>
      <tr class="total-row"><td colspan="2">Counted Cash</td><td class="num" id="dnTotal">0</td></tr>
      <tr><td colspan="2">Expected Cash (opening ${money(st.opening)} + cash sales ${money(st.cashSales)}${st.cashRefund?' − cash refunds '+money(st.cashRefund):''})</td><td class="num">${money(st.expected)}</td></tr>
      <tr><td colspan="2"><b>Difference</b></td><td class="num" id="dnDiff">0</td></tr>
    </tbody></table>
    <div class="field" style="margin-top:12px"><label>Remarks</label><input id="dnRemarks" value="${esc(ss.remarks||'')}"></div>
    <div class="modal-actions"><button class="btn secondary" id="dnCancel">Cancel</button><button class="btn" id="dnConfirm">Close Shift &amp; Generate Z Report</button></div>`, 500);
  const calc=()=>{
    let t=0; m.querySelectorAll('.dn').forEach(i=>{ const a=(parseFloat(i.value)||0)*(+i.dataset.d); t+=a; m.querySelector('#da'+i.dataset.d).textContent=fmtNum(a,0); });
    const coins=parseFloat(m.querySelector('#dnCoins').value)||0; t+=coins; m.querySelector('#daCoins').textContent=fmtNum(coins,0);
    m.querySelector('#dnTotal').textContent=money(t);
    const d=round2(t-st.expected); const el=m.querySelector('#dnDiff');
    el.textContent=(d>0?'Excess +':d<0?'Short ':'')+money(Math.abs(d)); el.className='num '+(d<0?'neg-val':d>0?'pos-val':'');
    return t;
  };
  m.querySelectorAll('input').forEach(i=>i.oninput=calc); calc();
  m.querySelector('#dnCancel').onclick=closeModal;
  m.querySelector('#dnConfirm').onclick=()=>{
    const total=calc(); const den={};
    m.querySelectorAll('.dn').forEach(i=>den[i.dataset.d]=parseFloat(i.value)||0);
    Object.assign(ss,{denoms:den,coins:parseFloat(m.querySelector('#dnCoins').value)||0,countedCash:round2(total),remarks:m.querySelector('#dnRemarks').value,
      status:'Closed',closeDate:localISO(),closeTime:nowTime(),closedBy:currentUser.name});
    saveShift(ss); closeModal(); toast('Shift '+ss.id+' closed');
    if(after) after();
    showZReport(ss.id);
  };
}

    ${sec('Order Types',byType.map(r=>({name:r.name+' ('+r.orders+' orders)',net:r.net})))}

    ${sec('Items',byItem.map(r=>({name:r.name+(r.rqty?' −'+fmtQty(r.rqty)+' ret':''),qty:r.qty,net:r.net})))}
    <div class="z-sec">Discounts Given</div>
    ${Object.values(discMap).map(d=>`<div class="z-row"><span>${esc(d.name)} (${d.n})</span><span>${fmtNum(d.amt,2)}</span></div>`).join('')||'<div class="z-row"><span>None</span><span></span></div>'}
    <div class="z-sec">Refunds</div>
    ${rs.map(r=>`<div class="z-row"><span>${esc(r.id)} · ${esc(r.orderId)} · ${esc(r.payMethod)}<br><small>${esc(r.reason)}</small></span><span>-${fmtNum(r.net,2)}</span></div>`).join('')||'<div class="z-row"><span>None</span><span></span></div>'}

function showZReport(ssId){

/* ---------- Report filter helpers ---------- */
function presetRange(p){
  const t=localISO();
  if(p==='today') return [t,t];
  if(p==='yesterday'){ const y=addDays(t,-1); return [y,y]; }
  if(p==='last7') return [addDays(t,-6),t];
  if(p==='month') return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){ const d=new Date(t.slice(0,8)+'01T00:00:00'); d.setDate(0); const e=localISO(d); return [e.slice(0,8)+'01',e]; }
  if(p==='year') return [t.slice(0,5)+'01-01',t];
  if(p==='all'){ const ds=DB.orders.map(o=>o.date).filter(Boolean).sort(); return [ds[0]||t, t]; }
  return null;
}
const PRESETS=[['today','Today'],['yesterday','Yesterday'],['last7','Last 7 days'],['month','This month'],['lastmonth','Last month'],['year','This year'],['all','All time'],['custom','Custom']];
function periodText(f){ return 'Period: '+fmtDate(f.from)+' to '+fmtDate(f.to); }

const SS_STATE={preset:'month',from:'',to:'',shiftName:'',cashierId:'',status:''};

      orders:st.orders,gross:st.gross,discount:st.discount,refund:st.refund,net:st.net,cash:st.cash,card:st.card,online:st.online,opening:st.opening,expected:st.expected,counted:st.counted,diff:st.diff}; });
    const sum=k=>round2(rows.reduce((a,r)=>a+(Number(r[k])||0),0));
    const total={orders:sum('orders'),gross:sum('gross'),discount:sum('discount'),refund:sum('refund'),net:sum('net'),cash:sum('cash'),card:sum('card'),online:sum('online'),opening:sum('opening'),expected:sum('expected'),
      counted:rows.some(r=>r.counted!==null)?sum('counted'):null, diff:rows.some(r=>r.diff!==null)?sum('diff'):null};
    const detail={title:'Shift-wise Detail',cols:[{label:'Shift ID',key:'id'},{label:'Date',key:'date'},{label:'Shift',key:'shift'},{label:'Cashier',key:'cashier'},{label:'Time',key:'time'},{label:'Status',key:'status'},

      {label:'Cash',key:'cash',type:'money'},{label:'Card',key:'card',type:'money'},{label:'Online',key:'online',type:'money'},{label:'Opening Cash',key:'opening',type:'money'},
      {label:'Expected Cash',key:'expected',type:'money'},{label:'Counted Cash',key:'counted',type:'money'},{label:'Difference',key:'diff',type:'diff'}],rows,total,empty:'No shifts in this period.'};
    const byName={}; list.forEach(s=>{ const st=shiftStats(s); const k=s.shiftName; byName[k]=byName[k]||{shift:k,sessions:0,orders:0,gross:0,discount:0,refund:0,net:0,cash:0,card:0,online:0};
      const r=byName[k]; r.sessions++; ['orders','gross','discount','refund','net','cash','card','online'].forEach(x=>r[x]=round2(r[x]+st[x])); });
    const nRows=SHIFT_NAMES.filter(n=>byName[n]).map(n=>byName[n]).concat(Object.keys(byName).filter(n=>!SHIFT_NAMES.includes(n)).map(n=>byName[n]));
    const nTotal={sessions:rows.length,orders:total.orders,gross:total.gross,discount:total.discount,refund:total.refund,net:total.net,cash:total.cash,card:total.card,online:total.online};

    const meta=reportMeta([periodText(S)+(S.shiftName?' · Shift: '+S.shiftName:'')+(S.cashierId?' · Cashier: '+(cashiers.find(x=>x[0]===S.cashierId)||[0,''])[1]:'')+(S.status?' · Status: '+S.status:'')]);

  const upd=()=>{ S.preset=c.querySelector('#sPreset').value; S.from=c.querySelector('#sFrom').value; S.to=c.querySelector('#sTo').value;
    S.shiftName=c.querySelector('#sShift').value; S.cashierId=c.querySelector('#sCashier').value; S.status=c.querySelector('#sStatus').value; draw(); };

  ['#sFrom','#sTo'].forEach(id=>c.querySelector(id).onchange=()=>{ c.querySelector('#sPreset').value='custom'; upd(); });
  ['#sShift','#sCashier','#sStatus'].forEach(id=>c.querySelector(id).onchange=upd);
  c.querySelector('#sPdf').onclick=()=>{ const r=build(); exportPDF('Shift Summary Report',[r.byShiftName,r.detail],r.meta,'shift-summary-'+S.from+'-to-'+S.to); };
  c.querySelector('#sXls').onclick=()=>{ const r=build(); exportExcel([{sheet:'Summary by Shift',title:'Shift Summary — by Shift',meta:r.meta,def:r.byShiftName},{sheet:'Shift Detail',title:'Shift Summary — Detail',meta:r.meta,def:r.detail}],'shift-summary-'+S.from+'-to-'+S.to); };
  draw();
}

const RPT_TABS=[['menuType','Menu Type'],['category','Category'],['item','Item'],['date','Date'],['month','Month'],['orderType','Order Type'],['time','Time'],['payment','Payment'],['shift','Shift']];
const RS={preset:'month',from:'',to:'',menuId:'',catId:'',orderType:'',payMethod:'',shiftName:'',tab:'menuType'};
function salesDef(dimKey){
  const f=RS; const agg=salesAgg(f,dimKey); const d=DIMS[dimKey];
  const cols=[{label:d.label,key:'name'}];
  if(dimKey==='item') cols.push({label:'Category',key:'cat'});
  cols.push({label:'Orders',key:'orders',type:'int'},{label:'Qty Sold',key:'qty',type:'qty'},{label:'Refund Qty',key:'rqty',type:'qty'},{label:'Gross Sales',key:'gross',type:'money'},
    {label:'Discount',key:'discount',type:'money'},{label:'Refunds',key:'refund',type:'money'},{label:'Net Sales',key:'net',type:'money'},{label:'% of Net',key:'share',type:'pct'});
  return {def:{title:'Sales by '+d.label,cols,rows:agg.rows,total:agg.total},total:agg.total};
}
function salesMeta(){
  const f=RS; const parts=[];
  if(f.menuId) parts.push('Menu Type: '+menuName(f.menuId));
  if(f.catId) parts.push('Category: '+catName(f.catId));
  if(f.orderType) parts.push('Order Type: '+f.orderType);
  if(f.payMethod) parts.push('Payment: '+f.payMethod);
  if(f.shiftName) parts.push('Shift: '+f.shiftName);
  const lines=[periodText(f)];
  if(parts.length) lines.push('Filters: '+parts.join(' · '));
  return reportMeta(lines);
}

  c.querySelector('#rXls').onclick=()=>{ const r=salesDef(f.tab); exportExcel([{sheet:r.def.title.replace('Sales by ',''),title:r.def.title,meta:salesMeta(),def:r.def}],fname()); };
  c.querySelector('#rXlsAll').onclick=()=>{ const meta=salesMeta(); exportExcel(RPT_TABS.map(([k,l])=>{ const r=salesDef(k); return {sheet:l,title:r.def.title,meta,def:r.def}; }),'sales-all-views-'+f.from+'-to-'+f.to); };
  draw();

function renderRolesPage(c){
  const PAGES_FOR_PERMS=PAGES.filter(p=>!p.adminOnly&&!p.noPerm).map(p=>({key:p.key,label:p.label,group:p.group}));
  const RIGHTS=['view','add','edit','del'], RL={view:'View',add:'Add',edit:'Edit',del:'Delete'};
  const roles=DB.roles;
  c.innerHTML=`
    <h1 class="page-title">Roles &amp; Permissions</h1>
    <p class="page-desc">Each role decides which pages a user sees and what they can do there. Admin always has full access. For POS: <b>Add</b> = ring up sales, <b>Edit/Delete</b> = change orders in an open shift. For Cashier Shifts: <b>Edit</b> = see and close other cashiers' shifts. For Refunds: <b>Add</b> = make refunds, <b>Delete</b> = void a refund in an open shift.</p>
    ${canAdd('roles')?'<button class="btn" id="addRole" style="margin-bottom:14px">+ Add Role</button>':''}
    <div class="table-wrap"><table><thead><tr><th>Role</th><th>Pages visible</th><th>Users</th><th></th></tr></thead><tbody>
      <tr><td><b>Admin</b></td><td><span class="tag info">Full access</span></td><td>${DB.users.filter(u=>u.role==='Admin').length}</td><td></td></tr>
      ${roles.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="tag">${PAGES_FOR_PERMS.filter(p=>(r.permissions[p.key]||{}).view).length}/${PAGES_FOR_PERMS.length}</span></td>
        <td>${DB.users.filter(u=>u.role===r.name).length}</td>
        <td style="white-space:nowrap">${canEdit('roles')?`<button class="btn small secondary" data-edit="${r.id}">✎ Edit Permissions</button>`:''}
        ${canDel('roles')?`<button class="row-del" data-del="${r.id}">✕</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
  const open=(id)=>{
    const role=id?roles.find(r=>r.id===id):null; const perms=role?role.permissions:{};
    const groups=[...new Set(PAGES_FOR_PERMS.map(p=>p.group))];
    const m=openModal(`<h3>${role?'Edit Role: '+esc(role.name):'New Role'}</h3>
      <div class="field" style="max-width:280px;margin-top:10px"><label>Role Name</label><input id="rmName" value="${esc(role?role.name:'')}"></div>
      <div class="table-wrap"><table><thead><tr><th>Page</th>${RIGHTS.map(r=>`<th style="text-align:center">${RL[r]}</th>`).join('')}<th style="text-align:center">All</th></tr></thead><tbody>
      ${groups.map(g=>`<tr><td colspan="6" style="background:var(--primary-soft);font-weight:700;font-size:11px;color:var(--primary-dark)">${esc(g)}</td></tr>`+
        PAGES_FOR_PERMS.filter(p=>p.group===g).map(p=>{ const pr=perms[p.key]||{}; return `<tr><td>${esc(p.label)}</td>${RIGHTS.map(r=>`<td style="text-align:center"><input type="checkbox" data-p="${p.key}" data-r="${r}" ${pr[r]?'checked':''}></td>`).join('')}
          <td style="text-align:center"><input type="checkbox" class="allrow" data-p="${p.key}" ${RIGHTS.every(r=>pr[r])?'checked':''}></td></tr>`; }).join('')).join('')}
      </tbody></table></div>
      <div class="modal-actions"><button class="btn secondary" id="rmCancel">Cancel</button><button class="btn" id="rmSave">Save Role</button></div>`, 720);
    m.querySelectorAll('.allrow').forEach(cb=>cb.onchange=()=>m.querySelectorAll(`input[data-p="${cb.dataset.p}"][data-r]`).forEach(x=>x.checked=cb.checked));
    m.querySelectorAll('input[data-r]').forEach(cb=>cb.onchange=()=>{
      if(cb.checked && cb.dataset.r!=='view') m.querySelector(`input[data-p="${cb.dataset.p}"][data-r="view"]`).checked=true;
      m.querySelector(`.allrow[data-p="${cb.dataset.p}"]`).checked=RIGHTS.every(r=>m.querySelector(`input[data-p="${cb.dataset.p}"][data-r="${r}"]`).checked);
    });
    m.querySelector('#rmCancel').onclick=closeModal;
    m.querySelector('#rmSave').onclick=()=>{
      const name=m.querySelector('#rmName').value.trim();
      if(!name){ toast('Role name is required'); return; }
      if(name.toLowerCase()==='admin' || roles.some(r=>r!==role && r.name.toLowerCase()===name.toLowerCase())){ toast('That role name is already used'); return; }
      const np={}; PAGES_FOR_PERMS.forEach(p=>{ np[p.key]={}; RIGHTS.forEach(r=>np[p.key][r]=m.querySelector(`input[data-p="${p.key}"][data-r="${r}"]`).checked); });
      if(role){ if(role.name!==name) DB.users.forEach(u=>{ if(u.role===role.name) u.role=name; }); role.name=name; role.permissions=np; }
      else roles.push({id:uid('ROL',roles,'id',3),name,permissions:np});
      saveMaster(); closeModal(); toast('Role saved'); buildNav(); renderRolesPage(c);
    };
  };
  const ab=c.querySelector('#addRole'); if(ab) ab.onclick=()=>open(null);
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(b.dataset.edit));
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const r=roles.find(x=>x.id===b.dataset.del);
    if(DB.users.some(u=>u.role===r.name)){ toast('Cannot delete — this role is assigned to users'); return; }
    if(!confirm('Delete role "'+r.name+'"?')) return;
    DB.roles=roles.filter(x=>x!==r); saveMaster(); renderRolesPage(c); toast('Role deleted');
  });
}

const SAMPLE_ITEM_NAMES=['Chicken Tikka','Butter Chicken','Chicken Karahi (Half)','Steam Rice','Butter Naan','Soft Drink','Kheer','Staff Meal','Corporate Platter'];
const DEFAULT_PASSWORDS=['admin123','mgr123','cash123'];
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function pick(arr,weights){
  if(!weights) return arr[Math.floor(Math.random()*arr.length)];
  const t=weights.reduce((s,w)=>s+w,0); let r=Math.random()*t;
  for(let i=0;i<arr.length;i++){ r-=weights[i]; if(r<=0) return arr[i]; } return arr[arr.length-1];
}
async function generateSampleSales(days){
  const items=DB.menuItems.filter(m=>m.active!=='N');
  if(!items.length) throw new Error('Add some menu items first');
  const discs=DB.discounts.filter(d=>d.active!=='N' && (Number(d.value)||0)>0);
  const staff=DB.users.filter(u=>u.active!=='N');
  const today=localISO();
  let oN=maxNum(DB.orders,'ORD','id'), sN=maxNum(DB.shiftSessions,'SS','id');
  const newOrders=[], newShifts=[], newRefunds=[]; let rN=maxNum(DB.refunds,'RF','id');
  const SHIFTS=[{name:'Morning',start:11,end:16,close:'16:05'},{name:'Evening',start:16,end:23,close:'23:55'}];
  for(let d=days; d>=1; d--){
    const date=addDays(today,-d);
    const dow=new Date(date+'T00:00:00').getDay();
    const busy=(dow===5||dow===6||dow===0)?1.5:1;
    SHIFTS.forEach(sh=>{
      const cashier=pick(staff);
      const ss={id:'SS'+pad(++sN,4),cashierId:cashier.id,cashierName:cashier.name,shiftName:sh.name,date,openTime:pad(sh.start)+':00',
        openingCash:5000,status:'Closed',closeDate:date,closeTime:sh.close,countedCash:0,denoms:{},coins:0,remarks:'Sample data',closedBy:cashier.name,test:true};
      const n=Math.round(rnd(sh.name==='Evening'?12:6, sh.name==='Evening'?24:14)*busy);
      const times=[]; for(let i=0;i<n;i++){ const h=pick([...Array(sh.end-sh.start).keys()].map(x=>x+sh.start), [...Array(sh.end-sh.start).keys()].map(x=>(sh.start+x>=19&&sh.start+x<=21)||(sh.start+x>=13&&sh.start+x<=14)?3:1)); times.push(pad(h)+':'+pad(rnd(0,59))); }
      times.sort();
      let cash=0; const shiftOrdersNew=[];
      times.forEach(t=>{
        const lines=[]; const nl=rnd(1,4);
        for(let k=0;k<nl;k++){ const mi=pick(items); const ex=lines.find(l=>l.itemId===mi.id);
          if(ex) ex.qty++; else lines.push({itemId:mi.id,name:mi.name,catId:mi.catId,menuId:mi.menuId,price:Number(mi.price)||0,qty:rnd(1,3)}); }
        const gross=linesGross(lines);
        const disc=(discs.length && Math.random()<0.18)?pick(discs):null;
        const dAmt=calcDiscount(gross,disc), net=round2(gross-dAmt);
        const pay=pick(PAY_METHODS,[60,25,15]);
        if(pay==='Cash') cash+=net;
        shiftOrdersNew.push({id:'ORD'+pad(++oN,5),date,time:t,shiftSessionId:ss.id,shiftName:ss.shiftName,cashierId:cashier.id,cashierName:cashier.name,
          orderType:pick(ORDER_TYPES,[55,30,15]),discId:disc?disc.id:'',discName:disc?disc.name:'',discType:disc?disc.type:'',discValue:disc?Number(disc.value)||0:0,
          payMethod:pay,items:lines,gross,discount:dAmt,net,tendered:null,change:null,customer:null,status:'Paid',test:true});
      });
      shiftOrdersNew.forEach(o=>{
        newOrders.push(o);
        if(Math.random()<0.03){
          const l=pick(o.items); const q=Math.max(1,Math.ceil(l.qty/2)); const items=[Object.assign({},l,{qty:q})];
          const g=linesGross(items), d=o.gross?round2(o.discount*g/o.gross):0, net=round2(g-d);
          const [hh,mm]=o.time.split(':').map(Number); const tm=Math.min(hh*60+mm+rnd(10,40), sh.end*60-5);
          const rf={id:'RF'+pad(++rN,5),date,time:pad(Math.floor(tm/60))+':'+pad(tm%60),orderId:o.id,orderDate:o.date,orderTime:o.time,orderType:o.orderType,origPayMethod:o.payMethod,
            payMethod:o.payMethod,shiftSessionId:ss.id,shiftName:ss.shiftName,cashierId:cashier.id,cashierName:cashier.name,items,gross:g,discount:d,net,
            reason:pick(REFUND_REASONS,[3,2,3,1,1,1]),note:'Sample data',test:true};
          if(rf.payMethod==='Cash') cash-=net;
          newRefunds.push(rf);
        }
      });
      ss.countedCash=round2(5000+cash+pick([0,0,0,0,-100,50,-500,200]));
      newShifts.push(ss);
    });
  }
  DB.orders.push(...newOrders); DB.shiftSessions.push(...newShifts); DB.refunds.push(...newRefunds); saveLocal();
  if(_fbRoot){
    const upd={};
    newOrders.forEach(o=>upd['orders/'+o.id]=clone(o));
    newShifts.forEach(x=>upd['shifts/'+x.id]=clone(x));
    newRefunds.forEach(x=>upd['refunds/'+x.id]=clone(x));
    await _fbRoot.update(upd);
    await _fbRoot.child('counters/order').transaction(n=>Math.max(Number(n)||0,oN));
    await _fbRoot.child('counters/shift').transaction(n=>Math.max(Number(n)||0,sN));
    await _fbRoot.child('counters/refund').transaction(n=>Math.max(Number(n)||0,rN));
  }
  return {orders:newOrders.length,shifts:newShifts.length,refunds:newRefunds.length};
}

function gearPath(cx,cy,r,t){
  let d=''; const n=t*2;
  for(let i=0;i<n;i++){ const a0=i*Math.PI*2/n, a1=(i+1)*Math.PI*2/n, R=i%2?r:r*1.22;

function icon(n,sz){ return `<svg viewBox="0 0 24 24" width="${sz||13}" height="${sz||13}" aria-hidden="true" style="vertical-align:-2px">${ICONS[n]||''}</svg>`; }
const GROUP_COLORS={'Sales & Reports':'#4F5BD5','Setup':'#1EA672'};

function focusFirst(sel){ setTimeout(()=>{ const el=document.querySelector(sel); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus(); } },60); }
const PAGES=[
  {key:'home',label:'Home',group:'Home',render:renderHome,live:true,noPerm:true},
  {key:'pos',label:'Point Of Sale',group:'Sales & Reports',tag:'POS',icon:'cart',render:renderPOSPage,
    quick:{title:'New sale',run:()=>{ navigateTo('pos'); focusFirst('#fQ, #osCash'); }}},
  {key:'shifts',label:'Cashier Shifts',group:'Sales & Reports',tag:'Time',icon:'clock',render:renderShiftsPage,live:true,
    quick:{title:'Open a shift',perm:'add',run:()=>{ navigateTo('shifts'); focusFirst('#osCash'); }}},
  {key:'refunds',label:'Refunds',group:'Sales & Reports',tag:'Refund',color:'#C2413A',icon:'undo',render:renderRefundsPage,live:true,
    quick:{title:'Refund an order',perm:'add',run:()=>{ navigateTo('refunds'); focusFirst('#rfQ'); }}},
  {key:'shiftSummary',label:'Shift Summary',group:'Sales & Reports',tag:'Shifts',icon:'clip',render:renderShiftSummary,live:true},
  {key:'dashboard',label:'Dashboard',group:'Sales & Reports',tag:'Overview',color:'#D9762F',icon:'chart',render:renderDashboard,live:true},
  {key:'salesReports',label:'Sales Reports',group:'Sales & Reports',tag:'Reports',color:'#D9762F',icon:'chart',render:renderSalesReports,live:true},
  {key:'menuTypes',label:'Menu Types',group:'Setup',tag:'Menu',icon:'book',render:c=>renderCrud(c,'menus'),
    quick:{title:'Add menu type',perm:'add',run:()=>{ navigateTo('menuTypes'); focusFirst('#crudForm input:not([disabled])'); }}},
  {key:'menuCategories',label:'Menu Categories',group:'Setup',tag:'Menu',icon:'folder',render:c=>renderCrud(c,'menuCategories'),
    quick:{title:'Add category',perm:'add',run:()=>{ navigateTo('menuCategories'); focusFirst('#crudForm input:not([disabled])'); }}},
  {key:'menuItems',label:'Menu Items',group:'Setup',tag:'Menu',icon:'utensils',render:c=>renderCrud(c,'menuItems'),
    quick:{title:'Add menu item',perm:'add',run:()=>{ navigateTo('menuItems'); focusFirst('#crudForm input:not([disabled])'); }}},
  {key:'discounts',label:'Discounts',group:'Setup',tag:'Offers',icon:'tag',render:c=>renderCrud(c,'discounts'),
    quick:{title:'Add discount',perm:'add',run:()=>{ navigateTo('discounts'); focusFirst('#crudForm input:not([disabled])'); }}},
  {key:'roles',label:'Roles & Permissions',group:'Setup',tag:'Access',icon:'shield',render:renderRolesPage,
    quick:{title:'Add role',perm:'add',run:()=>{ navigateTo('roles'); setTimeout(()=>{ const b=document.getElementById('addRole'); if(b) b.click(); },60); }}},
  {key:'users',label:'User Accounts',group:'Setup',tag:'Team',icon:'user',render:renderUsersPage,
    quick:{title:'Add user',perm:'add',run:()=>{ navigateTo('users'); setTimeout(()=>{ const b=document.getElementById('addUser'); if(b) b.click(); },60); }}},
  {key:'settings',label:'Restaurant Settings',group:'Setup',tag:'Settings',icon:'gear',render:renderSettingsPage},
  {key:'goLive',label:'Test Data & Go Live',group:'Setup',tag:'Launch',icon:'rocket',render:renderGoLivePage,adminOnly:true,live:true},
];

function cardBadge(key){
  if(key==='pos'){ const s=myOpenShift(); return s?`<span class="hcard-badge on">● Your shift is open</span>`:''; }
  if(key==='shifts'){ const n=DB.shiftSessions.filter(s=>s.status==='Open').length; return n?`<span class="hcard-badge on">● ${n} open</span>`:''; }
  if(key==='dashboard'||key==='salesReports'){ const t=salesAgg({from:localISO(),to:localISO()},'orderType').total; return (t.orders||t.refunds)?`<span class="hcard-badge">Today ${money(t.net)}</span>`:''; }
  if(key==='refunds'){ const t=filterRefunds({from:localISO(),to:localISO()}); return t.length?`<span class="hcard-badge">Today ${t.length} · ${money(t.reduce((a,r)=>a+(Number(r.net)||0),0))}</span>`:''; }
  if(key==='goLive') return isTestMode()?`<span class="hcard-badge warn">🧪 Test mode</span>`:`<span class="hcard-badge on">● Live</span>`;
  return '';
}
function renderHome(c){
  const groups=[], byG={};
  PAGES.forEach(p=>{ if(p.key==='home'||!canView(p.key)) return; if(!byG[p.group]){ byG[p.group]=[]; groups.push(p.group); } byG[p.group].push(p); });
  const hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  c.innerHTML=`
    <div class="home-hero"><div><h1 class="page-title">${greet}, ${esc(currentUser.name.split(' ')[0])}</h1>
      <p class="page-desc" style="margin:0">${esc(fmtDate(localISO()))} · ${esc(DB.settings.name)} — choose a module to get started.</p></div></div>
    ${groups.map(g=>`<h2 class="home-group" style="--gc:${GROUP_COLORS[g]||'#4F5BD5'}">${esc(g)}</h2>
      <div class="home-grid">${byG[g].map(p=>{
        const q=p.quick && (!p.quick.perm || (p.quick.perm==='add'?canAdd(p.key):true));
        return `<div class="hcard" data-key="${p.key}" tabindex="0" role="button" aria-label="${esc(p.label)}">
          <div class="hcard-art">${ART[p.key]?ART[p.key]():''}${cardBadge(p.key)}</div>
          <button class="hcard-plus ${q?'':'go'}" data-plus="${p.key}" title="${q?esc(p.quick.title):'Open '+esc(p.label)}" aria-label="${q?esc(p.quick.title):'Open '+esc(p.label)}">
            ${q?'<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
               :'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'}</button>
          <div class="hcard-body"><div class="hcard-tag" style="color:${p.color||GROUP_COLORS[g]||'#4F5BD5'}">${icon(p.icon)} ${esc(p.tag||g)}</div>
            <div class="hcard-title">${esc(p.label)}</div></div></div>`; }).join('')}</div>`).join('')}`;
  c.querySelectorAll('.hcard').forEach(card=>{
    card.onclick=()=>navigateTo(card.dataset.key);
    card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); navigateTo(card.dataset.key); } };
  });
  c.querySelectorAll('[data-plus]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const p=PAGES.find(x=>x.key===b.dataset.plus);
    if(p.quick && (!p.quick.perm || canAdd(p.key))) p.quick.run(); else navigateTo(p.key);
  });
}

function closeDropdowns(){}
function buildNav(){
  const nm=document.getElementById('navMenus');
  nm.innerHTML=`<button class="nav-home" id="navHome">${icon('home',16)} Home</button><div class="nav-crumb" id="navCrumb"></div>`;
  document.getElementById('navHome').onclick=()=>navigateTo('home');
  updateCrumb();
}
function updateCrumb(){
  const el=document.getElementById('navCrumb'); if(!el) return;
  const pg=PAGES.find(p=>p.key===currentPage);
  document.getElementById('navHome').classList.toggle('active',!pg||pg.key==='home');
  el.innerHTML=(!pg||pg.key==='home')?'':`<span>${esc(pg.group)}</span><span class="sep">›</span><b>${esc(pg.label)}</b>`;
}
function navigateTo(key){
  destroyCharts(); closeModal(); window._posRefresh=null;
  const c=document.getElementById('content');
  if(!canView(key)) key='home';
  currentPage=key;
  const pg=PAGES.find(p=>p.key===key);
  updateCrumb();
  pg.render(c);
  window.scrollTo(0,0);
}

/* =====================================================================
   SECTION 14 — BOOT
   ===================================================================== */
function showLoading(msg){
  let o=document.getElementById('_loading');
  if(!o){ o=document.createElement('div'); o.id='_loading';
    o.style.cssText='position:fixed;inset:0;background:#f5f7f5;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:sans-serif';
    o.innerHTML='<div style="font-size:30px">🔄</div><div style="font-weight:600;color:#0E5C4E">Loading…</div><div id="_loadingMsg" style="font-size:12px;color:#666"></div>';
    document.body.appendChild(o); }
  document.getElementById('_loadingMsg').textContent=msg||'';
}
function hideLoading(){ const o=document.getElementById('_loading'); if(o) o.remove(); }
function enterApp(){
  document.getElementById('loginOverlay').classList.remove('show');
  document.getElementById('app').style.display='flex';
  updateNavUser(); buildNav(); applyBranding();
  navigateTo('home');
}
async function boot(){
  showLoading('Opening data…');
  const cfg=getFbCfg();
  const local=loadLocal();
  if(cfg.dbUrl && cfg.apiKey && cfg.projectId && initFirebase(cfg)){
    setSync('syncing','⟳ Connecting…'); showLoading('Connecting to cloud…');
    try{
      const snap=await withTimeout(_fbRoot.once('value'),9000);
      const v=snap.val();
      if(v && v.master){
        DB=fromRemote(v);
        if(local){ // push anything sold on this device while offline
          const lv=DB.settings.mode==='live';
          local.orders.filter(o=>o._unsynced && !(lv&&o.test) && !DB.orders.some(x=>x.id===o.id)).forEach(o=>DB.orders.push(o));
          local.shiftSessions.filter(s=>s._unsynced && !(lv&&s.test)).forEach(s=>{ const i=DB.shiftSessions.findIndex(x=>x.id===s.id); if(i>=0) DB.shiftSessions[i]=s; else DB.shiftSessions.push(s); });
          local.refunds.filter(r=>r._unsynced && !(lv&&r.test) && !DB.refunds.some(x=>x.id===r.id)).forEach(r=>DB.refunds.push(r));
        }
      } else {
        DB=local||normalize(seedData());
        await _fbRoot.set(toRemote(DB));
      }
      setSync('synced','✓ Synced');
    }catch(e){
      DB=local||normalize(seedData());
      setSync('error','✕ Offline – local cache');
    }
    saveLocal(); startListener();
  } else {
    if(cfg.dbUrl) setSync('error','✕ Config error');
    DB=local||normalize(seedData()); saveLocal();
  }
  applyBranding(); hideLoading();
  if(restoreSession()) enterApp(); else document.getElementById('loginOverlay').classList.add('show');
}

/* ---------- static wiring ---------- */
function doLogin(){
  if(!DB) return;
  if(loginUser(document.getElementById('loginUser').value.trim(), document.getElementById('loginPass').value)) enterApp();
  else document.getElementById('loginErr').style.display='block';
}
document.getElementById('loginBtn').onclick=doLogin;
['loginUser','loginPass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }));
document.getElementById('logoutBtn').onclick=()=>{ if(myOpenShift() && !confirm('Your shift is still open. Log out anyway? (The shift stays open until closed.)')) return; logoutUser(); };
document.getElementById('syncPill').onclick=()=>{ if(isAdmin()) openFirebaseCfg(); else toast('Only an Admin can change cloud sync settings'); };
document.getElementById('modePill').onclick=()=>{ if(isAdmin()) navigateTo('goLive'); else toast(isTestMode()?'Test mode: sales entered now are practice data and will be erased at go-live':'Live since '+fmtDate(DB.settings.liveSince)); };
document.getElementById('backupPill').onclick=()=>{ if(isAdmin()||currentUser.role==='Manager') openBackupModal(); else toast('Only an Admin or Manager can take backups'); };
document.getElementById('closeReceiptBtn').onclick=()=>document.getElementById('receiptModal').classList.remove('show');
document.getElementById('printReceiptBtn').onclick=()=>window.print();
document.getElementById('receiptModal').addEventListener('click',e=>{ if(e.target.id==='receiptModal') e.target.classList.remove('show'); });
document.addEventListener('click',e=>{ if(!e.target.closest('#navMenus')) closeDropdowns(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); document.getElementById('receiptModal').classList.remove('show'); } });
function tick(){ const n=new Date(); document.getElementById('clockPill').textContent=n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);
boot();
</script>
